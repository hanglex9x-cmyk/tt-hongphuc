<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Quản lý Trung tâm Đào tạo Lái xe Hồng Phúc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#ffffff; --surface:#ffffff; --surface-alt:#f2f7f3;
  --text:#0C2417; --dim:#4B6656; --border:#DCE8DF;
  --accent:#00B050; --accent-dark:#007A38; --warn:#FFC107; --danger:#E53935;
  --navy:#1E3A8A; --radius:20px;
  --font-sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{overflow-x:clip;max-width:100%}
body{font-family:var(--font-sans);overscroll-behavior:none;background:#ffffff;min-height:100dvh;margin:0;color:var(--text);font-size:15px;line-height:1.45}
img,svg,video,canvas{max-width:100%}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--text)}
@media(min-width:768px){input,select,textarea{font-size:14px}}
a{color:var(--accent-dark)}
b,strong{font-weight:700}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

/* ---------- Shell ---------- */
.header-glass{background:linear-gradient(118deg,#007A38 0%,#00B050 52%,#00A047 78%,#1E3A8A 135%);border-bottom:1px solid rgba(255,255,255,.35);box-shadow:0 10px 30px rgba(0,90,45,.28);color:#fff;position:sticky;top:0;z-index:40}
.header-inner{display:flex;width:100%;align-items:center;gap:12px;padding:10px 12px}
@media(min-width:768px){.header-inner{padding:10px 24px}}
@media(max-width:767px){.header-inner{gap:8px;padding:8px 10px;align-items:flex-start}.header-inner .hamb{height:40px;width:40px;flex:none}}
.header-inner h1{margin:0;font-size:min(12.5px,3.25vw);font-weight:800;letter-spacing:0;line-height:1.3;white-space:nowrap}
@media(min-width:768px){.header-inner h1{font-size:18px}}
.header-inner .sub{margin:1px 0 0;font-size:10.5px;color:#DBEAFE;line-height:1.4}
@media(min-width:768px){.header-inner .sub{font-size:12px}}
@media(min-width:768px){.header-inner .sub{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}}
.brand-yellow{color:#FFD400;text-shadow:0 1px 6px rgba(0,60,30,.55),0 0 2px rgba(0,60,30,.4)}
.hamb{display:flex;height:44px;width:44px;align-items:center;justify-content:center;border:none;border-radius:8px;background:rgba(255,255,255,.10);color:#fff;font-size:24px}
@media(min-width:768px){.hamb{display:none}}
.admin-box{display:none;text-align:right}
@media(min-width:768px){.admin-box{display:block}}
.admin-box p{margin:0}
.layout{display:flex;width:100%;align-items:flex-start}
.glass-panel{background:#ffffff;border:1px solid #DCE8DF;box-shadow:0 2px 10px rgba(0,60,30,.06);border-radius:20px}
.glass-nav{background:#ffffff;border:1px solid #DCE8DF;box-shadow:0 4px 16px rgba(0,60,30,.08)}
aside.sidebar{position:sticky;top:76px;margin:12px;width:264px;flex-shrink:0;display:none;flex-direction:column;gap:4px;padding:12px}
@media(min-width:768px){aside.sidebar{display:flex}}
main{flex:1;min-width:0;padding:12px 12px 96px}
@media(min-width:768px){main{padding:12px 8px 32px 0}}
.navbtn{display:flex;min-height:48px;width:100%;align-items:center;gap:12px;border:none;border-radius:12px;padding:8px 12px;font-size:14px;font-weight:600;background:transparent;color:#1d4030;text-align:left;transition:background .15s}
.navbtn:hover{background:#F2F7F3}
.navbtn.active{color:#fff}
.btn-green-grad{background:linear-gradient(135deg,#00C853 0%,#00B050 45%,#007A38 100%);box-shadow:0 5px 16px rgba(0,150,70,.38),inset 0 1px 0 rgba(255,255,255,.35);color:#fff}
.btn-amber-grad{background:linear-gradient(135deg,#FFD54F 0%,#FFC107 55%,#FFA000 100%);box-shadow:0 5px 16px rgba(255,160,0,.32),inset 0 1px 0 rgba(255,255,255,.5);color:#111827}
.law-box{margin-top:12px;border-radius:12px;background:#E8F5E9;padding:12px;font-size:12px;line-height:1.6}
.law-box p{margin:0}
.drawer-wrap{position:fixed;inset:0;z-index:50}
@media(min-width:768px){.drawer-wrap{display:none}}
.drawer-bg{position:absolute;inset:0;background:rgba(6,61,32,.45);border:none;width:100%;height:100%}
.drawer-panel{position:absolute;top:0;left:0;height:100%;width:280px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;padding:12px;border-radius:0}
.bottomnav{position:fixed;right:0;bottom:0;left:0;z-index:40;border-radius:20px 20px 0 0;padding-bottom:env(safe-area-inset-bottom)}
@media(min-width:768px){.bottomnav{display:none}}
.bottomnav .grid5{display:grid;grid-template-columns:repeat(5,1fr);padding:4px}
.navbtn.compact{flex-direction:column;gap:2px;padding:6px 2px;font-size:11px;min-height:48px;align-items:center;text-align:center;line-height:1.15;justify-content:center}

/* ---------- Chung ---------- */
.stack{display:flex;flex-direction:column;gap:16px}
.stack-sm{display:flex;flex-direction:column;gap:8px}
.row-wrap{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
section.panel{padding:16px}
@media(min-width:768px){section.panel{padding:20px}}
.sec-head{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:12px}
.sec-head h2{margin:0;font-size:16px;font-weight:700}
@media(min-width:768px){.sec-head h2{font-size:18px}}
.sec-head .sub{margin:2px 0 0;font-size:12px;color:var(--dim)}
@media(min-width:768px){.sec-head .sub{font-size:14px}}
.loading{padding:40px 0;text-align:center;color:var(--dim)}
.loaderr{padding:40px 0;text-align:center;color:#E53935}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;border-radius:12px;padding:8px 14px;font-size:14px;font-weight:600;border:1px solid var(--border);background:#fff;color:var(--text)}
.btn:disabled{opacity:.5;cursor:default}
.btn-green{background:linear-gradient(135deg,#00C853 0%,#00B050 45%,#007A38 100%);box-shadow:0 5px 16px rgba(0,150,70,.38),inset 0 1px 0 rgba(255,255,255,.35);color:#fff;border:none}
.btn-amber{background:linear-gradient(135deg,#FFD54F 0%,#FFC107 55%,#FFA000 100%);box-shadow:0 5px 16px rgba(255,160,0,.32),inset 0 1px 0 rgba(255,255,255,.5);color:#111827;border:none}
.btn-blue{background:#0068FF;color:#fff;border:none}
.btn-danger{background:#E53935;color:#fff;border:none}
.btn-danger-o{background:#fff;color:#C62828;border:2px solid #E53935}
.btn-sm{min-height:40px;padding:6px 10px;font-size:13px;border-radius:10px}
.btn-xs{min-height:36px;padding:4px 10px;font-size:12px;border-radius:8px}
.btn-block{width:100%}
.input,.select{width:100%;min-height:48px;border-radius:10px;border:1px solid var(--border);padding:8px 12px;background:#fff}
.input-sm,.select-sm{min-height:44px}
textarea.input{min-height:80px}
.field{display:flex;flex-direction:column;gap:4px;font-size:14px}
.field>span{font-weight:500}
.field .hint{font-size:12px;color:var(--dim);font-weight:400}
.form-grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:768px){.form-grid{grid-template-columns:1fr 1fr}}
.form-grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.span2{grid-column:span 2}
.chip{display:inline-block;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:700;white-space:nowrap}
.tagchip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:500}
.teacher-pill{display:inline-flex;min-width:44px;align-items:center;justify-content:center;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:600;white-space:nowrap}
.plate-badge{display:inline-block;border-radius:6px;padding:2px 8px;font-family:ui-monospace,Menlo,monospace;font-size:13px;font-weight:700;color:#111827;background:#FFC107;white-space:nowrap}
.status-chip{display:inline-block;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;color:#fff;white-space:nowrap}
.bar{height:6px;border-radius:999px;background:var(--border);overflow:hidden;display:block}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--accent);font-style:normal}
.bar-lg{height:12px}
.tabs-seg{display:inline-flex;border-radius:12px;background:var(--surface-alt);padding:4px;gap:2px;max-width:100%;flex-wrap:wrap}
.tabs-seg button{min-height:44px;border:none;border-radius:8px;padding:6px 12px;font-size:14px;font-weight:600;background:transparent;color:var(--text)}
.tabs-seg button.on{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.mode-tabs{display:flex;flex-wrap:wrap;gap:8px}
.mode-tabs button{min-height:44px;border-radius:12px;padding:8px 16px;font-size:14px;font-weight:700;border:1px solid var(--border);background:#fff;color:var(--text)}
.mode-tabs button.on{border:none;color:#fff}
.note-dim{font-size:12px;color:var(--dim)}
.err-box{border-radius:12px;background:#FDECEA;padding:10px 12px;font-size:14px;color:#C62828}
.ok-box{border-radius:12px;background:#E8F5E9;padding:10px 12px;font-size:14px}
.warn-box{border-radius:12px;background:#FFF8E1;padding:10px 12px;font-size:14px}

/* ---------- Bảng ---------- */
.tbl-wrap{overflow-x:auto;max-width:100%}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
table.tbl thead tr{background:var(--navy);color:#fff;text-align:left}
table.tbl th{padding:10px 12px;font-weight:600;white-space:nowrap}
table.tbl td{padding:10px 12px;vertical-align:top}
table.tbl tbody tr.alt{background:var(--surface-alt)}
table.tbl-plain thead tr{background:transparent;color:var(--dim)}
table.tbl-plain th{border-bottom:1px solid var(--border);font-size:12px;padding:8px;white-space:normal}
table.tbl-plain td{border-bottom:1px solid rgba(220,232,223,.6);padding:10px 8px}
@media(min-width:768px){
  table.tbl,table.tbl-plain{font-size:13px}
  table.tbl th,table.tbl td{padding:6px 8px}
}
.d-only{display:none!important}
@media(min-width:768px){.d-only{display:block!important}}
.m-only{display:block!important}
@media(min-width:768px){.m-only{display:none!important}}
.mcard{border:1px solid var(--border);border-radius:16px;padding:12px;background:#fff}
.mlist{display:flex;flex-direction:column;gap:12px}

/* ---------- KPI / thẻ số ---------- */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(min-width:768px){.kpi-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1280px){.kpi-grid{grid-template-columns:repeat(5,1fr)}}
.kpi-card{padding:16px}
.kpi-card .lb{font-size:12px;font-weight:500;color:var(--dim);margin:0}
.kpi-card .vl{margin:4px 0 0;font-size:24px;font-weight:800;line-height:1.15}
.kpi-card .sb{margin:4px 0 0;font-size:12px;line-height:1.55;color:var(--dim)}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(min-width:1280px){.stat-grid{grid-template-columns:repeat(4,1fr)}}
.stat-card{border-radius:12px;background:var(--surface-alt);padding:14px}
.stat-card .lb{font-size:12px;font-weight:500;color:var(--dim);margin:0}
.stat-card .vl{margin:4px 0 0;font-size:24px;font-weight:800}
.stat-card .sb{margin:4px 0 0;font-size:12px;line-height:1.55;color:var(--dim)}
.grid2{display:grid;gap:16px}
@media(min-width:1280px){.grid2{grid-template-columns:1fr 1fr}}

/* ---------- Dashboard ---------- */
.alert-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;border-radius:12px;border-left:4px solid #ccc;padding:8px 12px;font-size:14px;width:100%;text-align:left;background:none;border-top:none;border-right:none;border-bottom:none;font-family:inherit;color:var(--text)}
.gantt-track{position:relative;height:32px;border-radius:8px;background:var(--surface-alt)}
.gantt-seg{position:absolute;top:4px;height:24px;display:flex;align-items:center;overflow:hidden;border-radius:6px;padding:0 8px;font-size:11px;font-weight:600;white-space:nowrap}
.heat-head{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:11px;font-weight:600;color:var(--dim)}
.heat-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:4px}
.heat-cell{display:flex;min-height:44px;flex-direction:column;align-items:center;justify-content:center;border-radius:8px;font-size:14px;font-weight:600;border:none;background:var(--surface-alt);color:var(--dim)}
.heat-cell small{font-size:9px;font-weight:400}
.heat-cell.sel{box-shadow:0 0 0 2px #fff,0 0 0 4px #1E3A8A}
.legend-row{display:flex;flex-wrap:wrap;gap:8px;font-size:11px;font-weight:600;align-items:center}
.legend-row .sw{display:inline-block;height:12px;width:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}

/* ---------- Lịch ---------- */
.conflict-banner{display:flex;min-height:48px;width:100%;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:2px solid #E53935;background:#FDECEA;padding:8px 16px;font-size:16px;font-weight:800;color:#C62828;font-family:inherit}
.conflict-panel{border:2px solid #E53935;background:#FFF5F5;border-radius:12px;padding:12px}
.conflict-item{border-radius:12px;background:#fff;padding:10px}
.type-legend{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12px}
.type-legend .sw{display:inline-block;height:12px;width:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.week-wrap{display:flex;flex-direction:column;gap:12px}
@media(min-width:768px){
  .week-wrap{display:block;overflow-x:auto;max-width:100%}
  .week-grid{display:grid;grid-template-columns:repeat(7,minmax(118px,1fr));gap:8px;min-width:840px}
}
.day-col{border-radius:12px;padding:10px;background:var(--surface-alt)}
.day-col.today{border:2px solid #00B050;background:#F0FAF3}
.day-col .dhead{margin:0 0 6px;font-size:14px;font-weight:700;text-align:center}
.day-col .dhead small{display:block;font-size:12px;font-weight:400;color:var(--dim)}
.marker-pill{display:block;margin-bottom:6px;border-radius:999px;padding:2px 8px;text-align:center;font-size:11px;font-weight:700;color:#fff}
.sess-card{border-radius:8px;background:#fff;padding:6px;font-size:11px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:6px}
.sess-card.clickable{cursor:pointer}
.sess-card.clickable:hover{box-shadow:0 0 0 2px #00B050}
.sess-card .nm{margin:2px 0 0;font-size:17px;line-height:1.25;font-weight:700;word-break:break-word}
.sess-card .meta{font-size:11px;font-weight:600;color:var(--dim)}
.sess-card .warnline{margin-top:4px;border-radius:6px;padding:2px 6px;font-weight:700;font-size:11px}
.sess-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;border-radius:12px;padding:8px 12px;font-size:14px;background:var(--surface-alt);margin-bottom:6px}
.sess-row.clickable{cursor:pointer}
.sess-row.clickable:hover{box-shadow:0 0 0 2px #00B050}
.sess-row .nm{font-size:17px;font-weight:700}
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.month-cell{display:flex;min-height:86px;flex-direction:column;align-items:flex-start;gap:4px;border-radius:12px;padding:8px;text-align:left;background:var(--surface-alt);border:1px solid var(--border);width:100%;font-family:inherit;color:var(--text)}
.month-cell.out{background:#fff;opacity:.45}
.month-cell.today{border:2px solid #00B050}
.month-cell.sel{box-shadow:0 0 0 2px #1E3A8A}
.month-cell .dnum{font-size:14px;font-weight:700}
.month-cell .cnt{font-size:11px;font-weight:600;color:var(--dim)}
.tdot{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:500}
.tdot i{display:inline-block;height:8px;width:8px;border-radius:99px;font-style:normal}

/* ---------- Modal / toast ---------- */
.modal-overlay{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(6,61,32,.45)}
@media(min-width:768px){.modal-overlay{align-items:center}}
.modal-box{width:100%;max-width:672px;max-height:92vh;overflow-y:auto;padding:16px;background:linear-gradient(150deg,rgba(255,255,255,.97),rgba(255,255,255,.94));border:1px solid #DCE8DF;border-radius:20px}
@media(min-width:768px){.modal-box{padding:24px}}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.modal-head h3{margin:0;font-size:18px;font-weight:700}
.modal-x{display:flex;height:44px;width:44px;flex:none;align-items:center;justify-content:center;border:none;border-radius:999px;background:var(--surface-alt);font-size:20px}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:80;max-width:92vw;display:none}
@media(min-width:768px){#toast{bottom:32px}}
#toast .tin{background:#0C2417;color:#fff;border-radius:12px;padding:12px 18px;font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.3);text-align:center}

/* ---------- Chi tiết HV / timeline ---------- */
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:14px}
@media(min-width:768px){.detail-grid{grid-template-columns:repeat(3,1fr)}}
.detail-grid p{margin:0}
.detail-grid .dim{color:var(--dim)}
.wide2{grid-column:span 2}
@media(min-width:768px){.wide3{grid-column:span 3}}
.timeline{position:relative;margin:0 0 0 8px;display:flex;flex-direction:column;gap:12px;border-left:2px solid var(--border);padding-left:16px;list-style:none}
.timeline li{position:relative;font-size:14px}
.timeline .dot{position:absolute;top:5px;left:-21px;height:10px;width:10px;border-radius:99px}
.crit{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.crit li{display:flex;align-items:center;gap:8px;font-size:14px}
.crit .ic{display:flex;height:20px;width:20px;flex:none;align-items:center;justify-content:center;border-radius:99px;font-size:11px;font-weight:700;color:#fff}

/* ---------- Tuyển sinh ---------- */
.docpill{display:inline-block;min-height:36px;border-radius:999px;border:1px solid #ccc;padding:4px 10px;font-size:12px;font-weight:600;white-space:nowrap;background:#fff;font-family:inherit}
.docpill:disabled{opacity:.5}

/* ---------- Kỳ thi ---------- */
.big-stat{border:2px solid;border-radius:16px;padding:16px}
.big-stat .vl{font-size:36px;font-weight:800;line-height:1;margin:0}
select.partsel{min-height:44px;border-radius:8px;border:1px solid var(--border);padding:4px 8px;font-weight:600;width:100%}
input.licdate{min-height:44px;border-radius:8px;border:1px solid var(--border);background:#fff;padding:4px 8px;max-width:100%}
.reg-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}

/* ---------- Báo cáo ---------- */
.chart-legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;margin-top:6px}
.chart-legend .sw{display:inline-block;height:10px;width:10px;border-radius:2px;vertical-align:-1px;margin-right:5px}
.costlist{display:grid;grid-template-columns:1fr;gap:4px;font-size:14px;list-style:none;margin:12px 0 0;padding:0}
@media(min-width:768px){.costlist{grid-template-columns:1fr 1fr}}
.costlist li{display:flex;justify-content:space-between;border-radius:8px;background:var(--surface-alt);padding:4px 8px;gap:8px}

/* ---------- Hướng dẫn ---------- */
.guide-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.guide-chips button{min-height:44px;border-radius:999px;border:1px solid var(--border);background:#fff;padding:6px 12px;font-size:12px;font-weight:600;font-family:inherit}
@media(min-width:768px){.guide-chips button{font-size:14px}}
.guide-sec{scroll-margin-top:96px}
.step-li{display:flex;gap:10px;font-size:14px;line-height:1.6}
@media(min-width:768px){.step-li{font-size:16px}}
.step-n{display:flex;height:24px;width:24px;flex:none;align-items:center;justify-content:center;border-radius:99px;font-size:12px;font-weight:800;color:#fff;background:#00B050}
.qa-box{border-radius:12px;background:var(--surface-alt);padding:12px}
ul.disc{list-style:disc;padding-left:20px;margin:0;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.6}
@media(min-width:768px){ul.disc{font-size:16px}}
ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ol.steps2{list-style:none;margin:0;padding:0;display:grid;gap:8px}
@media(min-width:768px){ol.steps2{grid-template-columns:1fr 1fr}}

<script>
/* =====================================================================
   HỒNG PHÚC — frontend GitHub Pages, dữ liệu qua Apps Script API (Sheet)
   Giao diện chép theo bản mẫu Muse artifact đã duyệt.
   ===================================================================== */

// ---------- Cấu hình API (GIỮ NGUYÊN) ----------
const DEFAULT_API_URL = 'https://script.google.com/macros/s/AKfycbxFG7h7a-FiI2UBB8bdr9UfyUZ936Vb0SKkBeikLorRDg8TECPxHGONSzkt9HrHVZuMQg/exec';
const API_URL = (() => {
  const q = new URLSearchParams(location.search).get('api');
  if (q) { try { localStorage.setItem('hp_api_url', q); } catch (e) {} return q; }
  try { return localStorage.getItem('hp_api_url') || DEFAULT_API_URL; } catch (e) { return DEFAULT_API_URL; }
})();
const TODAY = '2026-10-27';

// ---------- API ----------
let cbSeq = 0;
function apiGet(action, params) {
  return new Promise((resolve, reject) => {
    const cb = '__hpcb' + (++cbSeq);
    const qs = new URLSearchParams({ action, callback: cb });
    Object.entries(params || {}).forEach(([k, v]) => { if (v !== undefined && v !== null && v !== '') qs.set(k, typeof v === 'object' ? JSON.stringify(v) : String(v)); });
    const sc = document.createElement('script');
    const timer = setTimeout(() => { cleanup(); reject(new Error('Quá thời gian chờ API')); }, 60000);
    function cleanup() { clearTimeout(timer); try { delete window[cb]; } catch (e) {} sc.remove(); }
    window[cb] = (data) => { cleanup(); resolve(data); };
    sc.onerror = () => { cleanup(); reject(new Error('Không gọi được API')); };
    sc.src = API_URL + '?' + qs.toString();
    document.head.appendChild(sc);
  });
}
async function apiPost(action, params) {
  const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, params: params || {} }) });
  return res.json();
}
async function call(action, params) {
  const r = await apiGet(action, params);
  if (r && r.ok === false) throw new Error(r.error || 'Lỗi không xác định');
  return r;
}
async function write(action, params) {
  const r = await apiPost(action, params);
  if (!r || r.ok === false) throw new Error((r && r.error) || 'Không lưu được');
  return r;
}

// ---------- Định dạng & ngày (an toàn múi giờ: tính bằng Date.UTC) ----------
const BRAND = { green: '#00B050', amber: '#FFC107', navy: '#1E3A8A', red: '#E53935' };
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function fmtMoney(n) { return `${(Number(n) || 0).toLocaleString('vi-VN')}đ`; }
function fmtMoneyShort(n) {
  n = Number(n) || 0;
  if (Math.abs(n) >= 1e9) return `${(n / 1e9).toLocaleString('vi-VN', { maximumFractionDigits: 2 })} tỷ`;
  if (Math.abs(n) >= 1e6) return `${(n / 1e6).toLocaleString('vi-VN', { maximumFractionDigits: 2 })}tr`;
  return fmtMoney(n);
}
function fmtKm(n) { return (Number(n) || 0).toLocaleString('vi-VN'); }
function fmtHours(n) { return `${String(n).replace('.', ',')}h`; }
function fmtPct(n) { return `${String(n).replace('.', ',')}%`; }
function fmtDate(iso) { if (!iso) return '—'; const p = String(iso).split('-'); return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : String(iso); }
function utcMs(iso) { const [y, m, d] = String(iso).split('-').map(Number); return Date.UTC(y || 2026, (m || 1) - 1, d || 1); }
function isoOf(ms) { return new Date(ms).toISOString().slice(0, 10); }
function addDays(iso, n) { return isoOf(utcMs(iso) + n * 86400000); }
function mondayOf(iso) { const dow = (new Date(utcMs(iso)).getUTCDay() + 6) % 7; return addDays(iso, -dow); }
function monthStartOf(iso) { return String(iso).slice(0, 7) + '-01'; }
function addMonths(iso, n) { const [y, m] = String(iso).split('-').map(Number); return isoOf(Date.UTC(y, (m - 1) + n, 1)); }
function daysBetween(a, b) { return Math.round((utcMs(b) - utcMs(a)) / 86400000); }
function daysUntil(iso) { if (!iso) return 0; return Math.max(0, daysBetween(TODAY, iso)); }
const DOW_LABELS = ['Thứ 2', 'Thứ 3', 'Thứ 4', 'Thứ 5', 'Thứ 6', 'Thứ 7', 'Chủ nhật'];
function shortNameOf(full) { const p = String(full || '').trim().split(/\s+/); return p[p.length - 1] || ''; }
function shortStudentName(full) { const p = String(full || '').trim().split(/\s+/).filter(Boolean); return p.length <= 2 ? String(full || '').trim() : p.slice(-2).join(' '); }
function gvName(name) { const n = String(name || '').trim(); if (!n) return n; return n.startsWith('Gv.') ? n : `Gv. ${n}`; }
function normText(v) { return String(v || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd'); }

const COURSE_DATES = {
  K38: { open: '2026-06-01', close: '2026-09-30' }, K39: { open: '2026-07-01', close: '2026-10-31' },
  K40: { open: '2026-08-01', close: '2026-11-30' }, K41: { open: '2026-09-01', close: '2026-12-31' },
  'C1-K120': { open: '2026-07-01', close: '2026-12-31' }, BK220: { open: '2026-08-01', close: '2026-12-31' },
};
function courseOpenOf(code, open) { return open || (COURSE_DATES[code] || {}).open || ''; }
function courseCloseOf(code, close) { return close || (COURSE_DATES[code] || {}).close || ''; }

  if (o) parts.push(`KG ${fmtDate(o)}`);

function shortCenterName(name) { return String(name || '').replace(/^Trung tâm liên kết\s*/i, '').trim(); }

// ---------- CSV / tải file ----------
function downloadFile(filename, content, mime) {
  const blob = new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function toCsv(rows, headers) {
  const e = (v) => { const s = String(v ?? ''); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const lines = [headers.join(',')];
  for (const r of rows) lines.push(headers.map(h => e(r[h] ?? '')).join(','));
  return `\uFEFF${lines.join('\r\n')}`;
}
function parseCsv(text) {
  const clean = String(text).replace(/^\uFEFF/, '');
  const rows = []; let cur = [], field = '', inQ = false;
  for (let i = 0; i < clean.length; i++) {
    const ch = clean[i] || '';
    if (inQ) {
      if (ch === '"') { if (clean[i + 1] === '"') { field += '"'; i++; } else inQ = false; }
      else field += ch;
    } else if (ch === '"') inQ = true;
    else if (ch === ',') { cur.push(field); field = ''; }
    else if (ch === '\n') { cur.push(field); field = ''; rows.push(cur); cur = []; }
    else if (ch !== '\r') field += ch;
  }
  if (field !== '' || cur.length) { cur.push(field); rows.push(cur); }
  const ne = rows.filter(r => r.some(c => c.trim() !== ''));
  if (ne.length < 2) return [];
  const headers = (ne[0] || []).map(h => h.trim());
  return ne.slice(1).map(r => { const o = {}; headers.forEach((h, i) => { o[h] = (r[i] || '').trim(); }); return o; });
}
function csvDate(v) { // dd/mm/yyyy -> yyyy-mm-dd (giữ nguyên nếu đã ISO)
  const m = String(v || '').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  return m ? `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}` : String(v || '');
}
function csvNum(v) { return Number(String(v || '').replace(/[^\d.-]/g, '')) || 0; }

// ---------- Components dùng chung ----------
function Logo(size) {
  size = size || 40;
  return `<svg width="${size}" height="${size}" viewBox="0 0 48 48" role="img" aria-label="Logo Hồng Phúc"><circle cx="24" cy="29" r="15" fill="none" stroke="#FFC107" stroke-width="3.5"/><circle cx="24" cy="29" r="4.5" fill="#FFC107"/><path d="M10.5 25 L19.5 28 M37.5 25 L28.5 28 M24 33.5 L24 43" stroke="#FFC107" stroke-width="3.5" stroke-linecap="round"/><path d="M24 4 L42 11 L24 18 L6 11 Z" fill="#00B050"/><path d="M33 14.5 V21 c0 2.5-4 4.5-9 4.5 s-9-2-9-4.5 V14.5" fill="none" stroke="#00B050" stroke-width="2.5"/><path d="M42 11 v8" stroke="#00B050" stroke-width="2.5" stroke-linecap="round"/></svg>`;
}
function Section(title, sub, inner, right) {
  return `<section class="glass-panel panel"><div class="sec-head"><div><h2>${title}</h2>${sub ? `<p class="sub">${sub}</p>` : ''}</div>${right || ''}</div>${inner}</section>`;
}
function Loading() { return '<p class="loading">Đang tải dữ liệu…</p>'; }
function LoadError(msg) { return `<p class="loaderr">Không tải được dữ liệu: ${esc(msg)}</p>`; }
function TeacherPill(short, color) {
  if (!short) return '';
  const dark = ['#FFD54F', '#FFC107', '#AED581', '#90CAF9', '#81C784'].includes(color);
  return `<span class="teacher-pill" style="background:${esc(color || '#90A4AE')};color:${dark ? '#1a1a1a' : '#ffffff'}">Gv. ${esc(short)}</span>`;
}
function PlateBadge(plate) { return plate ? `<span class="plate-badge">${esc(plate)}</span>` : '<span style="color:var(--dim)">—</span>'; }
function StatusChip(status) {
  const color = status === 'Đã có bằng' ? BRAND.green : status === 'Đã đậu sát hạch' ? '#00893D' : status === 'Đủ điều kiện thi' ? BRAND.navy : '#64748B';
  return `<span class="status-chip" style="background:${color}">${esc(status)}</span>`;
}
function DatMarkerChip(markerKm) {
  markerKm = Number(markerKm) || 0;
  if (markerKm === 0) return '<span style="color:var(--dim)">—</span>';
  const neg = markerKm < 0;
  return `<span class="mono" style="display:inline-block;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700;white-space:nowrap;color:#111827;background:${neg ? '#FFF9C4' : '#B2EBF2'}" title="${neg ? `Mốc DAT âm — còn thiếu ${Math.abs(markerKm)}km` : `Mốc DAT — đã chạy ${markerKm}km`}">${markerKm}KM</span>`;
}
function Pagination(page, total, pageSize, fnName) {
  const pages = Math.max(1, Math.ceil(total / pageSize));
  if (pages <= 1) return '';
  return `<div class="row-wrap" style="justify-content:space-between;margin-top:12px;font-size:14px"><span style="color:var(--dim)">Trang ${page}/${pages} · Tổng ${total}</span><span class="row-wrap"><button type="button" class="btn btn-sm" ${page <= 1 ? 'disabled' : ''} onclick="${fnName}(${page - 1})">‹ Trước</button><button type="button" class="btn btn-sm" ${page >= pages ? 'disabled' : ''} onclick="${fnName}(${page + 1})">Sau ›</button></span></div>`;
}
function openModal(title, bodyHtml) {
  document.getElementById('modal-root').innerHTML = `<div class="modal-overlay" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-box"><div class="modal-head"><h3>${esc(title)}</h3><button type="button" class="modal-x" aria-label="Đóng" onclick="closeModal()">×</button></div>${bodyHtml}</div></div>`;
}
function closeModal() { document.getElementById('modal-root').innerHTML = ''; }
let toastTimer = null;
function toast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toast-in').textContent = msg;
  t.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.display = 'none'; }, 3400);
}
function zaloBtn(kind, label, target, message) {
  const id = 'zb' + Math.random().toString(36).slice(2, 9);
  window._zalo = window._zalo || {};
  window._zalo[id] = { kind, message, target };
  return `<button type="button" id="${id}" class="btn btn-blue" style="min-height:44px" onclick="sendZaloBtn('${id}')">${esc(label)}</button>`;
}
async function sendZaloBtn(id) {
  const z = (window._zalo || {})[id]; if (!z) return;
  const btn = document.getElementById(id);
  if (btn) { btn.disabled = true; btn.textContent = 'Đang gửi…'; }
  try {
    await write('sendnotification', { title: z.kind, kind: z.kind, message: z.message, target: z.target });
    if (btn) btn.textContent = 'Đã gửi Zalo OA ✓';
    toast('Đã ghi thông báo Zalo OA');
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = 'Gửi lại Zalo'; }
    toast('Không gửi được: ' + e.message);
  }
}
/* Import/Export: Export tải CSV thật; Import đọc CSV rồi ghi qua các action
   lưu hiện có của backend (không có action importRows riêng). */
function importExportHtml(entity, filename, msgId) {
  return `<div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px"><div class="row-wrap"><button type="button" class="btn btn-green" style="min-height:44px" onclick="document.getElementById('imp-${entity}').click()">Import Excel</button><button type="button" class="btn btn-amber" style="min-height:44px" onclick="doExport('${entity}')">Export Excel</button><input id="imp-${entity}" type="file" accept=".csv,text/csv" style="display:none" onchange="doImport('${entity}',this)"></div><p data-impmsg="${entity}" class="note-dim" style="max-width:288px;text-align:right;margin:0"></p></div>`;
}
window._exporters = {};
function regExport(entity, filename, headers, rowsFn) { window._exporters[entity] = { filename, headers, rowsFn }; }
function doExport(entity) {
  const ex = window._exporters[entity]; if (!ex) return;
  downloadFile(ex.filename, toCsv(ex.rowsFn(), ex.headers), 'text/csv;charset=utf-8');
}
const IMPORT_MSG = {};
function setImportMsg(entity, msg) { const el = document.querySelector(`[data-impmsg="${entity}"]`); if (el) el.textContent = msg; }
async function doImport(entity, input) {
  const f = input.files && input.files[0];
  input.value = '';
  if (!f) return;
  const rows = parseCsv(await f.text());
  if (!rows.length) { toast('File rỗng hoặc sai định dạng — cần CSV có dòng tiêu đề đúng mẫu.'); return; }
  const imp = (window._importers || {})[entity];
  if (!imp) { toast('Mục này chưa hỗ trợ Import — dùng Export để sao lưu.'); return; }
  let ok = 0; const errs = [];
  for (let i = 0; i < rows.length; i++) {
    try { await imp(rows[i]); ok++; } catch (e) { if (errs.length < 3) errs.push(`Dòng ${i + 2}: ${e.message}`); }
  }
  toast(`Đã nhập ${ok}/${rows.length} dòng.${errs.length ? ' Lỗi: ' + errs.join('; ') : ''}`);
  go(state.view);
}
window._importers = {};

// ---------- Trạng thái chung ----------
const state = { view: 'dashboard', focusStudentId: null, focusStudentLabel: '' };
let LK = null; // lookups cache
async function getLookups(force) {
  if (!LK || force) LK = await call('getlookups', {});
  return LK;
}
let CONF = null; // {count, conflicts:[...]} + map sessionId -> {level, parts:[kind]}
async function getConflicts(force) {
  if (!CONF || force) {
    const r = await call('listconflicts', {});
    const map = {};
    (r.conflicts || []).forEach(c => (c.sessions || []).forEach(s => {
      if (!map[s.id]) map[s.id] = { level: c.severity || 'error', kinds: [] };
      map[s.id].kinds.push(c.kind);
      if ((c.severity || 'error') === 'error') map[s.id].level = 'error';
    }));
    CONF = { count: (r.conflicts || []).length, list: r.conflicts || [], map };
  }
  return CONF;
}
function sessionConflict(s) {
  const c = CONF && CONF.map[s.id];
  if (!c) return null;
  const txt = c.kinds.map(k => k === 'Trùng xe' ? 'trùng xe' : k === 'Trùng học viên' ? 'trùng học viên (2 buổi/ngày)' : k === 'Trùng giáo viên' ? 'trùng giáo viên' : String(k).toLowerCase());
  return { level: c.level, text: `Trùng lịch: ${txt.join(' + ')}` };
}
window._SESS = {}; // cache buổi học theo id (cho form sửa)
function regSessions(list) { (list || []).forEach(s => { window._SESS[s.id] = s; }); }

const VIEWS = [

  { id: 'fleet', label: 'GV · Xe · TT liên kết', icon: 'M5 16l1.5-5A2 2 0 0 1 8.4 9.5h7.2a2 2 0 0 1 1.9 1.5L19 16M5 16h14M5 16v4M19 16v4M7.5 13h.01M16.5 13h.01' },
  { id: 'exams', label: 'Kỳ thi sát hạch', icon: 'M12 15a6 6 0 1 0 0-12 6 6 0 0 0 0 12zM8.5 14L7 22l5-3 5 3-1.5-8' },

];
function navIcon(d) { return `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`; }
function navBtn(v, compact) {

  return `<button type="button" class="navbtn ${compact ? 'compact' : ''} ${on ? 'btn-green-grad active' : ''}" aria-label="${esc(v.label)}" ${on ? 'aria-current="page"' : ''} onclick="go('${v.id}')">${navIcon(v.icon)}<span>${esc(v.label)}</span></button>`;

function renderShell() {
  const navAll = VIEWS.map(v => navBtn(v)).join('');
  document.getElementById('app').innerHTML = `
  <header class="header-glass">
    <div class="header-inner">
      <button type="button" class="hamb" aria-label="Mở menu" onclick="openDrawer()">☰</button>
      ${Logo(42)}
      <div style="min-width:0;flex:1">
        <h1>TRUNG TÂM ĐÀO TẠO LÁI XE <span class="brand-yellow">HỒNG PHÚC</span></h1>

  <div class="layout">
    <aside class="glass-panel sidebar" aria-label="Menu chính">
      ${navAll}
      <div class="law-box">

<script>

const TYPE_META = {

}

/* ----- Sửa trực tiếp buổi học ----- */
const TIME_OPTIONS = (() => { const a = []; for (let h = 5; h <= 21; h++) { a.push(`${String(h).padStart(2, '0')}:00`); a.push(`${String(h).padStart(2, '0')}:30`); } return a; })();
function parseSlot(slot) {
  const m = String(slot || '').trim().match(/^(\d{1,2})(?::(\d{2}))?\s*-\s*(\d{1,2})(?::(\d{2}))?/);
  if (!m) return { start: '08:00', end: '10:00' };
  const f = (h, mi) => `${String(Number(h ?? 8)).padStart(2, '0')}:${mi ?? '00'}`;
  return { start: f(m[1], m[2]), end: f(m[3], m[4]) };
}
function composeSlot(start, end) {
  const [sh = '08', sm = '00'] = String(start).split(':');
  const [eh = '10', em = '00'] = String(end).split(':');
  if (sm === '00' && em === '00') return `${sh}-${eh}h`;
  return `${start}-${end}`;
}
const EDIT_TYPES = ['Lý thuyết', 'DAT', 'Sa hình', 'Cabin', 'Bổ túc', 'Thi tốt nghiệp'];
let EDIT_ID = null, EDIT_DEL_ARM = false;
async function openSessionEdit(id) {
  const s = window._SESS[id];

  EDIT_ID = id; EDIT_DEL_ARM = false;
  const lk = await getLookups();
  const t = parseSlot(s.slot);
  const types = EDIT_TYPES.includes(s.type) ? EDIT_TYPES : [s.type, ...EDIT_TYPES];
  const title = s.groupLabel || (s.studentName ? `${shortStudentName(s.studentName)} — ${typeMeta(s.type).label}` : typeMeta(s.type).label);
  const body = `
  <div id="edit-conflict-slot"></div>
  <div class="form-grid2">

    <label class="field"><span>Loại buổi</span><select id="ef-type" class="select">${types.map(x => `<option value="${esc(x)}" ${x === s.type ? 'selected' : ''}>${esc(typeMeta(x).label)}</option>`).join('')}</select></label>
    <label class="field"><span>Giờ bắt đầu</span><select id="ef-start" class="select">${TIME_OPTIONS.map(x => `<option ${x === t.start ? 'selected' : ''}>${x}</option>`).join('')}</select></label>
    <label class="field"><span>Giờ kết thúc</span><select id="ef-end" class="select">${TIME_OPTIONS.map(x => `<option ${x === t.end ? 'selected' : ''}>${x}</option>`).join('')}</select></label>

      <select id="ef-student" class="select" disabled><option value="">— Chưa gắn học viên —</option>${(lk.students || []).map(x => `<option value="${x.id}" ${x.id === s.studentId ? 'selected' : ''}>${esc(x.code)} · ${esc(x.name)} · ${esc(x.courseCode)} · DAT ${x.datKmDone}/${x.datKmTotal}km</option>`).join('')}</select>
      <span class="hint">Backend Sheet chưa hỗ trợ đổi học viên của buổi đã xếp — cần đổi HV thì xóa buổi này và xếp buổi mới.</span></label>
    <label class="field"><span>Giáo viên</span><select id="ef-teacher" class="select"><option value="">— Chưa gắn GV —</option>${(lk.teachers || []).map(x => `<option value="${x.id}" ${x.id === s.teacherId ? 'selected' : ''}>${esc(gvName(x.name))}${x.kind === 'botuc' ? ' (bổ túc)' : ''}</option>`).join('')}</select></label>
    <label class="field"><span>Xe</span><select id="ef-vehicle" class="select"><option value="">— Không dùng xe —</option>${(lk.vehicles || []).map(x => `<option value="${x.id}" ${x.id === s.vehicleId ? 'selected' : ''}>${esc(x.plate)} (${esc(x.status)})</option>`).join('')}</select></label>
    <label class="field"><span>Điểm danh (thực hiện buổi học)</span><select id="ef-att" class="select">${['Đã học', 'HV vắng', 'GV hủy'].map(x => `<option ${x === (s.attendance || 'Đã học') ? 'selected' : ''}>${x}</option>`).join('')}</select></label>
    <label class="field"><span>KM DAT kế hoạch của buổi</span><input id="ef-km" type="number" min="0" class="input" value="${s.km || 0}"></label>
    <label class="field"><span>Km thực tế (để trống = theo kế hoạch)</span><input id="ef-akm" type="number" min="0" class="input" value="${s.actualKm != null ? s.actualKm : ''}" placeholder="${s.km || 0}"></label>
    <p class="note-dim span2" style="margin:0">Tiến độ DAT của HV chỉ cộng KM THỰC TẾ của các buổi "Đã học" (buổi HV vắng / GV hủy không cộng km).</p>
    <label class="field span2"><span>Ghi chú</span><input id="ef-note" type="text" class="input" value="${esc(s.note || '')}" placeholder="VD: Phòng LT, Phòng cabin, học bù…"></label>
  </div>
  <div id="edit-result"></div>
  <div class="row-wrap" style="margin-top:12px">
    <button type="button" id="ef-del" class="btn btn-danger-o" onclick="editDelete()">Xóa buổi</button>

  </div>`;
  openModal(`Sửa buổi học — ${title}`, body);
}
async function editSave() {
  const s = window._SESS[EDIT_ID]; if (!s) return;
  const type = document.getElementById('ef-type').value;
  const payload = {
    id: EDIT_ID,
    date: document.getElementById('ef-date').value,
    slot: composeSlot(document.getElementById('ef-start').value, document.getElementById('ef-end').value),
    type,
    teacherId: document.getElementById('ef-teacher').value ? Number(document.getElementById('ef-teacher').value) : null,
    vehicleId: document.getElementById('ef-vehicle').value ? Number(document.getElementById('ef-vehicle').value) : null,
    km: type === 'DAT' ? (Number(document.getElementById('ef-km').value) || 0) : 0,
    note: document.getElementById('ef-note').value,
    attendance: document.getElementById('ef-att').value,

  };
  const veh = (LK.vehicles || []).find(v => v.id === payload.vehicleId);
  if (veh) payload.plate = veh.plate;
  const box = document.getElementById('edit-result');
  try {
    await write('updateschedule', payload);
    CONF = null;
    const cf = await getConflicts(true);
    const mine = cf.map[EDIT_ID];

      const kinds = mine.kinds.map(k => String(k).toLowerCase()).join(' + ');
      box.innerHTML = `<div class="warn-box" style="margin-top:12px"><p style="margin:0;font-weight:700;color:#B45309">✓ Đã lưu buổi học — nhưng buổi này đang ${esc(kinds)}. Xem danh sách lịch trùng để xử lý tiếp.</p><button type="button" class="btn btn-green" style="margin-top:8px" onclick="closeModal();refresh()">Đóng</button></div>`;
    } else {
      box.innerHTML = `<div class="ok-box" style="margin-top:12px"><p style="margin:0;font-weight:700;color:#00893D">✓ Đã lưu buổi học — mọi view lịch, tiến độ và kiểm tra trùng đã cập nhật.</p><button type="button" class="btn btn-green" style="margin-top:8px" onclick="closeModal();refresh()">Đóng</button></div>`;
    }
    toast('Đã lưu buổi học');
  } catch (e) {
    box.innerHTML = `<div class="err-box" style="margin-top:12px"><b>Không lưu được:</b> ${esc(e.message)}</div>`;
  }
}
async function editDelete() {
  const btn = document.getElementById('ef-del');

/* ----- ScheduleViews: xem Tuần / Tháng (dùng ở Lịch hôm nay + DAT) ----- */
const SVI = {};
function svRegister(id, defaultMode) {
  if (!SVI[id]) SVI[id] = { mode: defaultMode || 'week', weekStart: mondayOf(TODAY), monthCursor: monthStartOf(TODAY), selectedDate: TODAY, fTeacher: '', fPlate: '', fCenter: '', fType: '', fStudentId: '', studentSearch: '', data: null, centers: [] };
  return SVI[id];
}
async function svLoad(id) {
  const st = SVI[id];
  if (!window._DASH_SP) { try { const dash = await call('getdashboard', {}); window._DASH_SP = dash.sessionsProgress; window._DASH = dash; } catch (e) {} }
  const from = st.mode === 'week' ? st.weekStart : mondayOf(st.monthCursor);
  const to = st.mode === 'week' ? addDays(st.weekStart, 6) : addDays(mondayOf(st.monthCursor), 41);
  const [r, lk, ct] = await Promise.all([call('listschedulesrange', { from, to }), getLookups(), call('listcenters', {})]);
  regSessions(r.schedules);
  st.data = r; st.centers = ct.centers || [];
  st.lookups = lk;

/* Biểu đồ cột SVG viết tay (thay recharts): series = [{key,name,color}], data = [{month,...}] */
function barChartSvg(data, series, height) {
  height = height || 240;
  if (!data.length) return '';
  const W = 720, H = height, padL = 44, padB = 26, padT = 14;
  const max = Math.max(1, ...data.flatMap(d => series.map(s => Math.abs(Number(d[s.key]) || 0))));
  const iw = W - padL - 8, ih = H - padB - padT;
  const groupW = iw / data.length;
  const bw = Math.min(26, (groupW - 14) / series.length);
  let g = '';
  for (let i = 0; i <= 4; i++) {
    const v = max * i / 4, y = padT + ih - ih * i / 4;
    g += `<line x1="${padL}" y1="${y}" x2="${W - 8}" y2="${y}" stroke="#e5e7eb" stroke-dasharray="3 3"/><text x="${padL - 6}" y="${y + 4}" font-size="11" fill="#4B6656" text-anchor="end">${Math.round(v)}</text>`;
  }
  data.forEach((d, di) => {
    series.forEach((s, si) => {
      const v = Number(d[s.key]) || 0;
      const h = Math.max(0, ih * v / max), hNeg = Math.max(0, ih * (-v) / max);
      const x = padL + di * groupW + (groupW - bw * series.length) / 2 + si * bw;
      const y = v >= 0 ? padT + ih - h : padT + ih;
      const hh = v >= 0 ? h : hNeg;
      if (hh > 0) g += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw}" height="${hh.toFixed(1)}" rx="3" fill="${s.color}"><title>${esc(d.month || d.label || '')} · ${esc(s.name)}: ${v}tr</title></rect>`;
    });
    g += `<text x="${(padL + di * groupW + groupW / 2).toFixed(1)}" y="${H - 8}" font-size="11" fill="#4B6656" text-anchor="middle">${esc(d.month || d.label || '')}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Biểu đồ cột" style="display:block">${g}</svg><div class="chart-legend">${series.map(s => `<span><span class="sw" style="background:${s.color}"></span>${esc(s.name)}</span>`).join('')}</div>`;
}

async function dashMarkerGo(mhv) {
  const lk = await getLookups();
  const s = (lk.students || []).find(x => String(x.maHv) === String(mhv));
  if (s) go('dat', s.id);
  else go('dat');
}
async function dashHeat(date) {
  DASH.heatDate = date;
  document.querySelectorAll('.heat-cell').forEach(c => c.classList.remove('sel'));
  refresh();
}
async function dashLoadDay() {
  const host = document.getElementById('dash-day');
  if (!host) return;
  try {
    const r = await call('listschedules', { date: DASH.heatDate });
    regSessions(r.schedules);
    const total = (r.schedules || []).length;
    const rows = (r.schedules || []).slice(0, 8).map(s => `

    host.innerHTML = `<p style="margin:0 0 8px;font-size:14px"><b>Chi tiết ngày ${fmtDate(DASH.heatDate)} — ${total === 0 ? (DASH.heatDate === TODAY ? 'Chưa có dữ liệu lịch hôm nay' : 'Chưa có dữ liệu') : `${total} buổi`}</b></p><ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px">${rows || '<li style="font-size:14px;color:var(--dim)">Chưa có buổi chi tiết cho ngày này.</li>'}</ul>`;

}

      ${fld('Số CCCD', 'sf-cccd', f.cccd)}

          ${f.centerName && !centers.some(c => c.name === f.centerName) ? `<option value="${esc(f.centerName)}" selected>${esc(shortCenterName(f.centerName))}</option>` : ''}

        <input id="sf-discount" aria-label="Giảm tiền học phí" type="number" min="0" step="100000" class="input" value="${f.tuitionDiscount}" oninput="sfDiscountHint()">
        <span class="hint" id="sf-discount-hint"></span>
      </label>
      <label class="field"><span>Lý do giảm (không bắt buộc)</span>
        <input id="sf-dreason" aria-label="Lý do giảm tiền" list="discount-reason-options" class="input" placeholder="VD: Diện chính sách, Khuyến mãi khai giảng…" value="${esc(f.discountReason)}">
        <datalist id="discount-reason-options">${DISCOUNT_REASONS.map(r => `<option value="${esc(r)}">`).join('')}</datalist>

      <button type="button" class="btn btn-green" style="flex:1;min-height:48px;font-weight:700" onclick="sfSave()">Lưu học viên</button>

function sfStdTuition() {
  const code = document.getElementById('sf-course').value;
  const c = (LK && LK.courses || []).find(x => x.code === code);
  return c ? c.tuition : 20000000;
}
function sfCourseHint() {
  const code = document.getElementById('sf-course').value;
  document.getElementById('sf-course-hint').textContent = courseKgHan(code);
  sfDiscountHint();
}
function sfDiscountHint() {
  const std = sfStdTuition();
  const disc = Number(document.getElementById('sf-discount').value) || 0;
  const el = document.getElementById('sf-discount-hint');
  const invalid = disc < 0 || disc > std;
  el.innerHTML = `Học phí chuẩn theo hạng: ${fmtMoney(std)} · Phải thu sau giảm: <b>${fmtMoney(Math.max(0, std - disc))}</b>${invalid ? ` · <span style="color:#E53935;font-weight:600">Giảm tiền phải từ 0 đến ${fmtMoney(std)}</span>` : ''}`;
}
async function sfCheckCccd() {
  const v = document.getElementById('sf-cccd-check').value.trim();
  const out = document.getElementById('sf-cccd-result');
  if (!v) { out.textContent = 'Chưa nhập số CCCD.'; return; }
  out.textContent = 'Đang kiểm tra…';
  try {
    const r = await call('checkcccd', { cccd: v });
    if (r.found) {
      out.innerHTML = `<span style="color:#C62828;font-weight:700">TRÙNG CCCD</span> — đã có học viên <b>${esc(r.student.name)}</b> (${esc(r.student.code)} · ${esc(r.student.courseCode)} · ${esc(r.student.status)}).`;
    } else {
      out.innerHTML = '<span style="color:#00893D;font-weight:700">Chưa có trong hệ thống</span> — CCCD này chưa trùng với học viên nào.';
    }
  } catch (e) { out.textContent = 'Không kiểm tra được: ' + e.message; }
}
async function sfSave() {
  const name = document.getElementById('sf-name').value.trim();
  const disc = Number(document.getElementById('sf-discount').value) || 0;
  const err = document.getElementById('sf-error');
  const std = sfStdTuition();
  if (!name) { err.innerHTML = '<span class="err-box" style="display:block">Chưa nhập họ tên học viên.</span>'; return; }
  if (disc < 0 || disc > std) { err.innerHTML = `<span class="err-box" style="display:block">Giảm tiền phải từ 0 đến ${fmtMoney(std)}.</span>`; return; }
  const courseCode = document.getElementById('sf-course').value;
  const course = (LK.courses || []).find(c => c.code === courseCode);
  try {
    await write('savestudent', {
      id: SF_ID,
      name,
      phone: document.getElementById('sf-phone').value,
      cccd: document.getElementById('sf-cccd').value,
      dob: document.getElementById('sf-dob').value,
      address: document.getElementById('sf-address').value,
      courseCode,
      licenseClass: course ? course.licenseClass : '',
      centerName: document.getElementById('sf-center').value,
      healthExamDate: document.getElementById('sf-health').value,
      discount: disc,
      discountReason: document.getElementById('sf-dreason').value,
    });
    LK = null;
    toast('Đã lưu học viên');
    closeModal();
    refresh();
  } catch (e) {
    err.innerHTML = `<span class="err-box" style="display:block">${esc(e.message)}</span>`;
  }
}

async function datCreate() {
  const box = document.getElementById('dc-result');
  const payload = {
    date: document.getElementById('dc-date').value,
    slot: document.getElementById('dc-slot').value,
    type: document.getElementById('dc-type').value,
    studentId: document.getElementById('dc-student').value ? Number(document.getElementById('dc-student').value) : (state.focusStudentId || null),
    teacherId: document.getElementById('dc-teacher').value ? Number(document.getElementById('dc-teacher').value) : null,
    vehicleId: document.getElementById('dc-vehicle').value ? Number(document.getElementById('dc-vehicle').value) : null,
    km: 0,
  };
  payload.km = payload.type === 'DAT' ? (Number(document.getElementById('dc-km').value) || 0) : 0;
  const veh = (LK.vehicles || []).find(v => v.id === payload.vehicleId);
  if (veh) payload.plate = veh.plate;
  box.innerHTML = '<p class="loading">Đang kiểm tra trùng lịch…</p>';
  try {
    // Kiểm tra trùng phía client trên lịch cùng ngày (backend Sheet không chặn trùng)
    const day = await call('listschedules', { date: payload.date });
    const same = (day.schedules || []).filter(s => s.slot === payload.slot);
    const conflicts = [];
    if (payload.vehicleId && same.some(s => s.vehicleId === payload.vehicleId)) conflicts.push(`Trùng xe ${payload.plate || ''} — xe đã có buổi ${payload.slot} ngày ${fmtDate(payload.date)}`);
    if (payload.studentId && same.some(s => s.studentId === payload.studentId)) conflicts.push('Trùng học viên — HV đã có buổi cùng khung giờ');
    if (payload.studentId && (day.schedules || []).some(s => s.studentId === payload.studentId)) conflicts.push('Học viên đã có buổi khác trong ngày (luật 1 HV tối đa 1 buổi/ngày)');
    if (payload.teacherId && same.some(s => s.teacherId === payload.teacherId)) conflicts.push('Trùng giáo viên — GV đã có buổi cùng khung giờ');
    if (conflicts.length) {
      const busyV = new Set(same.map(s => s.vehicleId));
      const busyT = new Set(same.map(s => s.teacherId));
      const freeV = (LK.vehicles || []).filter(v => !busyV.has(v.id) && v.status !== 'Bảo dưỡng').slice(0, 5);
      const freeT = (LK.teachers || []).filter(t => !busyT.has(t.id)).slice(0, 5);
      box.innerHTML = `<div class="err-box" style="margin-top:12px"><p style="margin:0;font-weight:700">Trùng lịch: ${conflicts.map(esc).join(' · ')}</p>
        ${freeV.length ? `<p style="margin-top:4px">Xe trống gần nhất khung giờ này: ${freeV.map(v => PlateBadge(v.plate)).join(' ')}</p>` : ''}
        ${freeT.length ? `<p style="margin-top:4px">GV còn trống: ${freeT.map(t => esc(t.name)).join(', ')}</p>` : ''}
        <p style="margin-top:4px">Chưa xếp lịch — đổi xe / GV / khung giờ rồi bấm Xếp lịch lại.</p></div>`;
      return;
    }
    await write('createschedule', payload);
    const warnings = [];
    const stu = (LK.students || []).find(s => s.id === payload.studentId);
    const tch = (LK.teachers || []).find(t => t.id === payload.teacherId);
    if (stu && tch && stu.homeTeacherName && tch.name !== stu.homeTeacherName) warnings.push(`Đổi cặp GV: GV chính của ${stu.name} là ${gvName(stu.homeTeacherName)}`);
    if (stu && payload.plate && stu.plateKg && payload.plate !== stu.plateKg) warnings.push(`Đổi xe quen: xe khai giảng của ${stu.name} là ${stu.plateKg}`);
    const dsRow = DS.data && (DS.data.rows || []).find(r => r.studentId === payload.studentId);
    if (payload.type === 'Sa hình' && dsRow && dsRow.doneKm < 500) warnings.push(`${stu ? stu.name : 'HV'} chưa đủ 500km DAT (${dsRow.doneKm}km) — chưa đủ ĐK sa hình`);
    CONF = null;
    box.innerHTML = `<div class="ok-box" style="margin-top:12px"><p style="margin:0;font-weight:600;color:#00893D">Đã xếp lịch thành công.</p>${warnings.length ? `<ul style="margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px">${warnings.map(w => `<li class="warn-box" style="padding:6px 10px;font-weight:600;color:#B45309">⚠ ${esc(w)}</li>`).join('')}</ul>` : ''}<p style="margin-top:6px"><button type="button" class="btn btn-sm" onclick="refresh()">Tải lại lịch</button></p></div>`;
    toast('Đã xếp lịch thành công');
  } catch (e) {
    box.innerHTML = `<div class="err-box" style="margin-top:12px">Không xếp được lịch — ${esc(e.message)}</div>`;
  }
}

  try {
    const r = await write('saveadmission', {
      id: id || undefined, name,
      phone: document.getElementById('af-phone').value,
      licenseClass: document.getElementById('af-class').value,
      source: document.getElementById('af-source').value,
      note: document.getElementById('af-note').value,
      firstSubmitDate: document.getElementById('af-first').value,
      deadline: document.getElementById('af-deadline').value,
      healthExamDate: document.getElementById('af-health').value,
    });

    if (realId) {
      for (const x of DOC_FIELDS) {

        const cur = id ? ((ADM.data.rows || []).find(rr => rr.id === id) || { docs: {} }).docs[x.key] === 'Đã nộp' : false;

    closeModal();
    refresh();

async function paySubmit() {
  const sid = document.getElementById('pf-student').value;

  const kind = document.getElementById('pf-kind').value;
  let amount = Number(document.getElementById('pf-amount').value) || 0;
  if (kind === 'Hoàn phí' && amount > 0) amount = -amount;
  try {
    await write('addpayment', { studentId: Number(sid), amount, date: document.getElementById('pf-date').value, kind, method: document.getElementById('pf-method').value, note: document.getElementById('pf-note').value });
    toast('Đã ghi thu thành công');
    refresh();
  } catch (e) { msg.innerHTML = `<span class="err-box" style="display:block;margin-top:12px">${esc(e.message)}</span>`; }
}

      <div class="row-wrap" style="margin-bottom:12px">

        <select id="fl-vehicle" aria-label="Chọn xe đổ nhiên liệu" class="select"><option value="">— Chọn xe —</option>${vehicles.map(v => `<option value="${v.id}">${esc(v.plate)}</option>`).join('')}</select>
        <input id="fl-date" aria-label="Ngày đổ nhiên liệu" type="date" class="input" value="${TODAY}">
        <input id="fl-liters" aria-label="Số lít đổ" type="number" min="0" step="0.5" class="input" value="30" placeholder="Số lít">
        <input id="fl-odo" aria-label="Km đồng hồ lúc đổ" type="number" min="0" class="input" value="0" placeholder="Km đồng hồ">
        <input id="fl-amount" aria-label="Số tiền đổ xăng" type="number" min="0" step="10000" class="input" value="600000" placeholder="Số tiền">

      </div>
      <style>@media(min-width:768px){#fuel-form{grid-template-columns:repeat(6,1fr)!important}}</style>
      <p id="fl-msg"></p>
      <ul style="list-style:none;margin:0;padding:0" class="stack-sm">
        ${(d.logs || []).slice(0, 30).map(l => `<li class="row-wrap" style="border-radius:12px;background:var(--surface-alt);padding:8px 12px;font-size:14px">

          <button type="button" class="btn btn-sm" style="margin-left:auto;background:#fff" aria-label="Xóa lần đổ xăng ngày ${fmtDate(l.date)} của xe ${esc(l.plate)}" onclick="fuelDelete(${l.id})">Xóa</button>

function donutSvg(items, size) {
  size = size || 190;
  const total = items.reduce((a, x) => a + x.value, 0) || 1;
  let acc = 0; const cx = size / 2, r = size / 2 - 6, c = 2 * Math.PI * r;
  const segs = items.map(x => {
    const frac = x.value / total;
    const seg = `<circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="${x.color}" stroke-width="26" stroke-dasharray="${Math.max(0, frac * c - 3)} ${c}" stroke-dashoffset="${-acc * c}" transform="rotate(-90 ${cx} ${cx})"/>`;
    acc += frac; return seg;
  }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="Biểu đồ tròn">${segs}</svg>`;
}
function hBarSvg(rows, colorFn) {

    <span style="font-size:13.5px;font-weight:700;white-space:nowrap">${esc(r.valueLabel || String(r.value))}</span>

function sessionsProgressHtml(sp) {
  const total = sp.total || 0, sched = sp.scheduled || 0;
  const pct = total > 0 ? Math.round(sched / total * 100) : 0;
  const est = sched > 0 ? Math.ceil((sp.remaining || 0) / (sched / Math.max(1, sp.days || 1))) : 0;
  const dayTxt = est > 365 ? `${Math.floor(est / 30)} tháng ${est % 30} ngày` : `${est} ngày`;
  return `<div class="sp-box">
    <p style="margin:0;font-size:14px">📅 Tổng ô lưới: <b>${total}</b> buổi · Đã xếp lịch: <b>${sched}</b> buổi (${pct}%) · Còn phải xếp: <b>${sp.remaining || 0}</b> buổi</p>
    <div class="sp-bar"><div style="width:${pct}%"></div></div>
    <div class="sp-grid">
      <div><p style="margin:0;font-weight:700">📆 ${sp.days || 0} ngày</p><p class="note-dim">Từ ${fmtDate(sp.from)} đến ${fmtDate(sp.to)} (chỉ ngày trong hạn khóa)</p></div>
      <div><p style="margin:0;font-weight:700">🧩 DAT đặc biệt: ${sp.datSpecial || 0} buổi</p><p class="note-dim">Sa hình: ${sp.sahinh || 0} · Học thường: ${sp.regular || 0} · Nghỉ: ${sp.off || 0}</p></div>
      <div><p style="margin:0;font-weight:700">⏱ ${(sp.avgPerDay || 0).toLocaleString('vi-VN')} buổi/ngày</p><p class="note-dim">Mật độ xếp trung bình theo ngày</p></div>
      <div><p style="margin:0;font-weight:700">🏁 Ước tính xếp xong: ~${dayTxt}</p><p class="note-dim">Theo tốc độ xếp hiện tại</p></div>
    </div>
  </div>`;
}

    <section class="panel" id="hd-tong-quan">${Section('3 · Màn hình Tổng quan', '', `

    <section class="panel" id="hd-hoc-vien">${Section('5 · Quản lý học viên', '', `

    <section class="panel" id="hd-dat">${Section('6 · DAT & Sa hình', '', `

      ${guideStep('1', 'Bảng <b>Tổng hợp DAT</b> cho biết từng học viên: km đã chạy / tổng km, % hoàn thành, trạng thái (Đạt chuẩn / Đúng tiến độ / Chậm tiến độ / Chưa chạy), giờ đã học và tốc độ trung bình.')}

    <section class="panel" id="hd-tuyen-sinh">${Section('7 · Tuyển sinh & hồ sơ', '', `

      ${guideStep('4', 'Nút <b>Nhắc bổ sung</b> gửi tin nhắn mẫu qua Zalo OA liệt kê đúng các giấy tờ còn thiếu của từng người.')}

      ${guideNote('Giấy khám sức khỏe có hạn 12 tháng. Nếu ngày khám đã quá 11 tháng, nên yêu cầu học viên khám lại trước khi nhập học để hồ sơ thi không bị trả.')}`)}</section>
    <section class="panel" id="hd-hoc-phi">${Section('8 · Học phí & biên lai', '', `

      ${guideStep('4', 'Cần <b>giảm học phí</b> cho học viên (diện chính sách, khuyến mãi khai giảng, đóng trọn gói sớm, người quen giới thiệu): mở hồ sơ học viên ở mục Học viên và nhập số tiền giảm + lý do — phải thu, còn nợ và điều kiện thi “học phí đủ” tự cập nhật theo.')}
      ${guideNote('Doanh thu tháng ở Tổng quan và Báo cáo đều tính từ các lần thu thật, không nhập tay. Hoàn phí cũng ghi tại đây với số tiền âm.')}`)}</section>
    <section class="panel" id="hd-gv-xe">${Section('9 · Giáo viên · Xe · Trung tâm liên kết', '', `
      ${guideStep('1', '<b>Giáo viên:</b> bảng lương tháng = giờ dạy × đơn giá/giờ. Tên giáo viên hiển thị khắp hệ thống với tiền tố “Gv.” (ví dụ: Gv. Hùng) và mỗi giáo viên có 1 màu nhãn riêng để nhìn lịch là nhận ra ngay.')}
      ${guideStep('2', '<b>Xe tập lái:</b> mỗi xe gắn 1 giáo viên chủ xe và các khóa phụ trách. Hệ thống cảnh báo khi xe chạy quá 56 giờ/tuần, khi giấy tờ xe (đăng kiểm, bảo hiểm, phù hiệu) sắp hết hạn và khi xe tới hạn bảo dưỡng theo km.')}
      ${guideStep('3', '<b>Nhật ký nhiên liệu:</b> mỗi lần đổ xăng ghi ngày, số lít, km đồng hồ và số tiền — hệ thống tự tính định mức lít/100km cho từng xe.')}
      ${guideStep('4', '<b>Trung tâm liên kết:</b> danh sách đối tác gửi học viên (Hóc Môn, Thành Công, Nam Sài Gòn, Á Châu, Phú Giáo) — có thể thêm/bớt/chỉnh sửa. Hoa hồng = doanh thu × % hoa hồng, tổng hoa hồng tháng hiển thị ngay đầu mục.')}
      ${guideStep('5', '<b>Bổ túc &amp; thuê xe:</b> ghi từng lượt học bổ túc/thuê xe của khách lẻ: chọn dịch vụ là đơn giá tự điền (350.000đ hoặc 300.000đ/giờ), thành tiền = số giờ × đơn giá.')}
      ${guideNote('Mã trung tâm ghi trên lưới lịch giấy của trung tâm: HM = Hóc Môn, ACHAU = Á Châu, PGiao/PHGIAO = Phú Giáo. Khi lọc lịch theo trung tâm, chọn đúng tên trong danh sách là hệ thống tự khớp cả mã viết tắt.')}`)}</section>
    <section class="panel" id="hd-thi">${Section('10 · Kỳ thi sát hạch', '', `
      <p class="gtext">Theo Thông tư 108/2026 (hiệu lực 01/07/2026), kỳ thi sát hạch gồm <b>3 phần thi theo thứ tự: Lý thuyết → Sa hình → Đường trường</b>. Đậu phần trước mới được thi phần sau; rớt hoặc vắng phần nào thì các phần sau ghi “Chưa thi”.</p>
      ${guideStep('1', '<b>Điều kiện dự thi (đủ 5/5):</b> đạt bài kiểm tra lý thuyết · học đủ cabin 3h/3h · chạy DAT đủ số km theo hạng · hoàn thành đủ bài sa hình · đóng đủ học phí. Học viên đạt 5/5 tự hiện trong “Danh sách đủ điều kiện thi”.')}
      ${guideStep('2', '<b>Đợt thi:</b> tạo đợt thi (tên đợt, ngày thi, địa điểm), đăng ký học viên đủ điều kiện vào đợt, cập nhật trạng thái hồ sơ (Chưa nộp → Đã nộp Sở → Đã có biên nhận) và xuất danh sách dự thi (SBD, họ tên, ngày sinh, CCCD, hạng) để nộp Sở.')}
      ${guideStep('3', '<b>Nhập kết quả:</b> ở tab “Kết quả thi”, chọn Đậu/Rớt/Vắng cho từng phần. Hệ thống tự khóa phần Sa hình khi Lý thuyết chưa đậu, và khóa Đường trường khi Sa hình chưa đậu — đúng luật thi mới.')}
      ${guideStep('4', '<b>Thi tốt nghiệp:</b> chọn khóa để ghi ngày thi tốt nghiệp, kết quả, số chứng chỉ và ngày cấp cho từng học viên — đây là căn cứ để lập hồ sơ dự thi sát hạch.')}
      ${guideStep('5', '<b>Cấp bằng:</b> khi bằng về trung tâm, nhập “Ngày có bằng” và bật trạng thái “Đã có bằng”, rồi bấm nút Zalo trên cùng dòng để báo học viên mang CCCD đến nhận.')}
      ${guideNote('Học viên rớt 1 phần chỉ phải thi lại phần đó ở đợt sau; lệ phí thi lại ghi ở cột ghi chú của kết quả thi để đối chiếu khi thu thêm.')}`)}</section>
    <section class="panel" id="hd-bao-cao">${Section('11 · Báo cáo, cảnh báo & Zalo', '', `
      ${guideStep('1', '<b>Báo cáo &amp; biểu đồ:</b> doanh thu theo khóa, lời lỗ theo tháng, cơ cấu chi phí tháng hiện tại, học viên theo khóa, DAT theo khung giờ và theo xe. Kèm 3 mẫu báo cáo chuẩn Sở GTVT (kết quả đào tạo theo khóa, danh sách nhập học, dự thi/đậu theo đợt) — bấm là xuất file CSV mở bằng Excel.')}
      ${guideStep('2', '<b>Cảnh báo &amp; Zalo:</b> hệ thống tự quét và liệt kê: lịch trùng, mốc DAT âm/sắp hết hạn, học viên chưa học cabin, giấy khám sức khỏe sắp hết hạn, giấy tờ xe sắp hết hạn, xe tới hạn bảo dưỡng.')}
      ${guideStep('3', 'Mỗi loại thông báo (lịch học ngày mai, lịch thi, báo đậu, báo có bằng, nhắc DAT, nhắc cabin, nhắc khám sức khỏe) có sẵn <b>mẫu tin Zalo OA</b> — bấm nút là gửi và hệ thống ghi vào “Nhật ký thông báo đã gửi”.')}
      ${guideNote('Cảnh báo là dữ kiện sống: xử lý xong việc (ví dụ xếp thêm buổi DAT cho học viên âm km) thì lần mở lại trang, cảnh báo tương ứng sẽ tự biến mất hoặc giảm mức độ.')}`)}</section>
