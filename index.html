<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>TRUNG TÂM ĐÀO TẠO LÁI XE HỒNG PHÚC — Quản lý</title>
<style>
:root{--green:#00B050;--green-d:#007A38;--yellow:#FFD400;--ink:#123524;--mut:#5b7263;--line:#DCE8DF;--bg:#fff;--soft:#F2F8F3;--red:#D32F2F;--orange:#EF6C00;--teal:#B2EBF2;--warn:#FFF9C4}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,system-ui,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;min-height:44px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--green);border-color:var(--green)}
label{font-size:12.5px;font-weight:600;color:var(--mut);display:block;margin:0 0 5px}
a{color:var(--green-d)}
/* Header */
header.top{position:sticky;top:0;z-index:60;background:linear-gradient(90deg,var(--green),var(--green-d));color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 10px rgba(0,60,30,.25)}
header.top .logo{width:44px;height:44px;flex:0 0 44px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:24px}
header.top h1{font-size:17px;line-height:1.25;font-weight:800;letter-spacing:.2px}
header.top h1 .hp{color:var(--yellow)}
header.top .sub{font-size:12.5px;opacity:.92}
header.top .today{margin-left:auto;text-align:right;font-size:12.5px;line-height:1.4;white-space:nowrap}
header.top .today b{font-size:14px}
/* Layout */
.layout{display:flex;min-height:calc(100vh - 64px)}
nav.side{width:236px;flex:0 0 236px;border-right:1px solid var(--line);background:var(--soft);padding:12px 10px;position:sticky;top:64px;height:calc(100vh - 64px);overflow:auto}
nav.side button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;padding:11px 12px;border-radius:10px;font-size:14.5px;font-weight:600;color:var(--ink);margin-bottom:2px}
nav.side button.on{background:var(--green);color:#fff}
nav.side button .ic{font-size:17px}
main{flex:1;min-width:0;padding:18px 20px 90px}
nav.bottom{display:none}
/* Cards & grids */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 2px 8px rgba(0,60,30,.05)}
.kpi .v{font-size:24px;font-weight:800;color:var(--green-d)}
.kpi .l{font-size:12.5px;color:var(--mut);font-weight:600;margin-top:2px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,60,30,.05)}
.card h3{font-size:16px;margin-bottom:10px}
.card h3 .r{float:right;font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:900px){.grid2,.grid3{grid-template-columns:1fr}}
/* Tables → cards on mobile */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--soft);font-size:12.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.3px}
tr:hover td{background:#FAFDF9}
.num{text-align:right;font-variant-numeric:tabular-nums}
.money{font-variant-numeric:tabular-nums;white-space:nowrap}
/* Buttons, pills, chips */
.btn{background:var(--green);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-weight:700;font-size:14px;min-height:44px}
.btn.sec{background:#fff;color:var(--green-d);border:1.5px solid var(--green)}
.btn.danger{background:#fff;color:var(--red);border:1.5px solid var(--red)}
.btn.small{min-height:36px;padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.5}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;color:#fff;white-space:nowrap}
.pill.gv{font-size:12px}
.chip{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-size:12.5px;font-weight:600;margin:2px}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:700}
.tag.ok{background:#E0F2E4;color:var(--green-d)} .tag.bad{background:#FDECEC;color:var(--red)}
.tag.warn{background:var(--warn);color:#7A6400} .tag.info{background:var(--teal);color:#00586B}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:14px}
.toolbar .f{flex:1;min-width:150px}
.toolbar .f.sm{flex:0 1 170px}
/* Sessions */
.conflict-banner{background:#FDECEC;border:1.5px solid var(--red);color:var(--red);font-weight:800;border-radius:12px;padding:12px 14px;margin-bottom:14px;cursor:pointer;font-size:15px}
.sess{border:1px solid var(--line);border-left:5px solid var(--green);border-radius:12px;padding:10px 12px;margin-bottom:10px;background:#fff;cursor:pointer}
.sess.conf{border-color:var(--red);border-left-color:var(--red);background:#FFF7F7}
.sess .nm{font-size:17px;font-weight:700}
.sess .plate{display:inline-block;background:var(--yellow);border-radius:6px;padding:1px 8px;font-size:13px;font-weight:800}
.sess .meta{font-size:13px;color:var(--mut);margin-top:3px;line-height:1.5}
.daycol{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:12px}
.daycol h4{font-size:14px;margin-bottom:8px}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.mcell{border:1px solid var(--line);border-radius:10px;padding:8px;min-height:74px;cursor:pointer;background:#fff}
.mcell.off{opacity:.35}
.mcell.today{border:2px solid var(--green)}
.mcell .d{font-weight:800;font-size:13px}
.mcell .n{font-size:12px;color:var(--mut)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:3px}
/* Modal */
.modal{position:fixed;inset:0;background:rgba(10,40,20,.5);z-index:100;display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.modal .box{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px}
@media(min-width:700px){.modal{align-items:center}.modal .box{border-radius:18px}}
.modal h3{margin-bottom:12px;font-size:17px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
@media(max-width:560px){.frow{grid-template-columns:1fr}}
.mfoot{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
/* Misc */
.banner{background:#FFF8E1;border:1.5px solid #FFC107;border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:14px}
.alert{border-radius:12px;padding:11px 13px;margin-bottom:9px;font-size:14px;border:1px solid var(--line)}
.alert.error{background:#FDECEC;border-color:#F3B8B8}
.alert.warning{background:#FFF8E1;border-color:#FFE082}
.alert.info{background:#E8F6EC}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;background:#123524;color:#fff;padding:12px 18px;border-radius:12px;z-index:200;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.3);display:none;max-width:92vw;text-align:center}
.loading{text-align:center;padding:40px;color:var(--mut)}
.bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--green)}
.hm{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:4px}
.hm div{border-radius:6px;padding:5px 2px;text-align:center;font-size:10.5px;color:#083}
.docpill{cursor:pointer;border:1.5px solid var(--line);background:#fff;color:var(--mut)}
.docpill.done{background:var(--green);border-color:var(--green);color:#fff}
details.chap{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:#fff}
details.chap summary{font-weight:800;cursor:pointer;font-size:15px}
details.chap p,details.chap li{font-size:14px;line-height:1.6;color:#2c4636}
details.chap ul{margin:6px 0 0 18px}
#printArea{display:none}
@media print{body>*{display:none!important}#printArea{display:block!important}}
.receipt{width:148mm;margin:0 auto;font-size:13px;color:#000}
.receipt h2{font-size:16px;text-align:center}
@media(max-width:860px){
  nav.side{display:none}
  main{padding:14px 12px 110px}
  header.top .today{display:none}
  nav.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:80;padding:6px 2px calc(6px + env(safe-area-inset-bottom))}
  nav.bottom button{flex:1;background:none;border:none;font-size:10.5px;font-weight:700;color:var(--mut);padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
  nav.bottom button .ic{font-size:19px}
  nav.bottom button.on{color:var(--green-d)}
  table thead{display:none}
  table,tbody,tr,td{display:block;width:100%}
  tr{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:6px 4px;background:#fff}
  td{border:none;padding:5px 10px}
  td::before{content:attr(data-l);display:block;font-size:11px;color:var(--mut);font-weight:700;text-transform:uppercase}
  .num{text-align:left}
  .mgrid{grid-template-columns:repeat(7,1fr);gap:3px}
  .mcell{min-height:56px;padding:5px}
}
</style>
</head>
<body>
<header class="top">
  <div class="logo">🎓</div>
  <div>
    <h1>TRUNG TÂM ĐÀO TẠO LÁI XE <span class="hp">HỒNG PHÚC</span></h1>
    <div class="sub">404 QL1A, P. Thới An, Q12, TP.HCM · ☎ 0949 155 955</div>
  </div>
  <div class="today">Hôm nay<br><b id="todayLbl">—</b></div>
</header>
<div class="layout">
  <nav class="side" id="sideNav"></nav>
  <main id="main"><div class="loading">Đang tải dữ liệu…</div></main>
</div>
<nav class="bottom" id="bottomNav"></nav>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>
<div id="printArea"></div>

<script>
'use strict';
/* ================= CẤU HÌNH API =================
   Dán URL Web App Apps Script (đuôi /exec) vào API_URL sau khi deploy (xem apps-script/DEPLOY.md).
   Cũng có thể mở trang kèm ?api=<URL /exec> hoặc nhập trong mục Cảnh báo & Zalo. */
let API_URL = 'https://script.google.com/macros/s/AKfycbxFG7h7a-FiI2UBB8bdr9UfyUZ936Vb0SKkBeikLorRDg8TECPxHGONSzkt9HrHVZuMQg/exec';
const _qsApi = new URLSearchParams(location.search).get('api');
if (_qsApi) { API_URL = _qsApi; try { localStorage.setItem('hp_api_url', _qsApi); } catch (e) {} }
if (!API_URL) { try { API_URL = localStorage.getItem('hp_api_url') || ''; } catch (e) {} }

const TODAY = '2026-10-27';
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => (Number(n) || 0).toLocaleString('vi-VN');
const fmtTr = n => { const v = (Number(n) || 0) / 1000000; return (Math.round(v * 100) / 100).toLocaleString('vi-VN') + 'tr'; };
const dVN = d => { if (!d) return '—'; const p = String(d).slice(0, 10).split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : d; };
const short2 = name => String(name || '').trim().split(/\s+/).slice(-2).join(' ');
const gvName = t => 'Gv. ' + (t.shortName || short2(t.name) || '');
function toast(msg, ms) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', ms || 2600); }
function apiConfigured() { return !!API_URL; }

/* ---- Gọi API: GET qua JSONP (tránh CORS), POST qua fetch text/plain ---- */
let _cbSeq = 0;
function apiGet(action, params) {
  return new Promise((resolve, reject) => {
    if (!API_URL) return reject(new Error('Chưa cấu hình API'));
    const cb = '__hpcb' + (++_cbSeq) + '_' + Date.now();
    const qs = new URLSearchParams({ action, callback: cb });
    Object.keys(params || {}).forEach(k => { if (params[k] !== undefined && params[k] !== null && params[k] !== '') qs.set(k, typeof params[k] === 'object' ? JSON.stringify(params[k]) : String(params[k])); });
    const sc = document.createElement('script');
    const timer = setTimeout(() => { cleanup(); reject(new Error('API quá thời gian chờ')); }, 45000);
    function cleanup() { clearTimeout(timer); delete window[cb]; sc.remove(); }
    window[cb] = res => { cleanup(); resolve(res); };
    sc.onerror = () => { cleanup(); reject(new Error('Không gọi được API')); };
    sc.src = API_URL + (API_URL.includes('?') ? '&' : '?') + qs.toString();
    document.head.appendChild(sc);
  });
}
async function apiPost(action, params) {
  if (!API_URL) throw new Error('Chưa cấu hình API');
  const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, params: params || {} }) });
  return r.json();
}
async function call(action, params) {
  const res = await apiGet(action, params);
  if (res && res.ok === false) throw new Error(res.error || 'Lỗi API');
  return res;
}
async function write(action, params) {
  const res = await apiPost(action, params);
  if (res && res.ok === false) throw new Error(res.error || 'Lỗi ghi dữ liệu');
  toast('✅ Đã lưu');
  return res;
}

/* ---- Điều hướng ---- */
const MODULES = [
  { id: 'dashboard', label: 'Tổng quan', ic: '📊' },
  { id: 'today', label: 'Lịch hôm nay', ic: '📅' },
  { id: 'students', label: 'Học viên', ic: '🎓' },
  { id: 'schedule', label: 'Lịch DAT & Sa hình', ic: '🗓️' },
  { id: 'dat', label: 'Tổng hợp DAT', ic: '🛣️' },
  { id: 'payments', label: 'Học phí', ic: '💰' },
  { id: 'fleet', label: 'GV · Xe · TT liên kết', ic: '🚗' },
  { id: 'admissions', label: 'Tuyển sinh', ic: '📝' },
  { id: 'exams', label: 'Kỳ thi & cấp bằng', ic: '🏆' },
  { id: 'reports', label: 'Báo cáo', ic: '📈' },
  { id: 'alerts', label: 'Cảnh báo & Zalo', ic: '🔔' },
  { id: 'guide', label: 'Hướng dẫn', ic: '📖' }
];
const BOTTOM = ['dashboard', 'today', 'schedule', 'students', 'alerts'];
let cur = 'dashboard';
let LOOK = { courses: [], teachers: [], vehicles: [], students: [] };
function renderNav() {
  $('#sideNav').innerHTML = MODULES.map(m => `<button data-nav="${m.id}" class="${cur === m.id ? 'on' : ''}"><span class="ic">${m.ic}</span>${m.label}</button>`).join('');
  $('#bottomNav').innerHTML = BOTTOM.map(id => { const m = MODULES.find(x => x.id === id); return `<button data-nav="${id}" class="${cur === id ? 'on' : ''}"><span class="ic">${m.ic}</span>${m.label.split(' ')[0] === 'Lịch' ? 'Lịch' : m.label.split(' ')[0]}</button>`; }).join('') +
    `<button data-nav="more"><span class="ic">☰</span>Thêm</button>`;
  $$('[data-nav]').forEach(b => b.onclick = () => {
    const id = b.dataset.nav;
    if (id === 'more') { openMore(); return; }
    go(id);
  });
}
function openMore() {
  openModal('<h3>Chọn mục</h3>' + MODULES.filter(m => !BOTTOM.includes(m.id)).map(m => `<button class="btn sec" style="width:100%;margin-bottom:8px" onclick="closeModal();go('${m.id}')">${m.ic} ${m.label}</button>`).join(''));
}
function go(id) {
  cur = id; renderNav();
  const main = $('#main');
  main.innerHTML = '<div class="loading">Đang tải dữ liệu…</div>';
  const fn = VIEWS[id];
  if (fn) fn(main).catch(err => { main.innerHTML = `<div class="banner">⚠️ ${esc(err.message || err)}</div>`; });
  window.scrollTo(0, 0);
}
/* ---- Modal ---- */
function openModal(html) { $('#modalBox').innerHTML = html; $('#modal').classList.add('open'); }
function closeModal() { $('#modal').classList.remove('open'); }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
function confirmBox(msg, onOk) {
  openModal(`<h3>Xác nhận</h3><p style="margin-bottom:14px">${esc(msg)}</p><div class="mfoot"><button class="btn sec" onclick="closeModal()">Hủy</button><button class="btn danger" id="cfOk">Đồng ý</button></div>`);
  $('#cfOk').onclick = async () => { closeModal(); await onOk(); };
}
function courseLabel(c) { return `${c.code} · KG ${dVN(c.openDate)} · Hạn ${dVN(c.closeDate)}`; }
function sessCard(s, confIds) {
  const conf = confIds && confIds.has(s.id);
  const nm = s.studentId ? short2(s.studentName) : (s.type === 'Lý thuyết' ? 'Lý thuyết · ' + s.courseCode : 'Cabin · ' + s.courseCode);
  const marker = s.studentId && s.type === 'DAT' ? '' : '';
  return `<div class="sess ${conf ? 'conf' : ''}" onclick="editSession(${s.id})">
    <div><span class="nm">${esc(nm)}</span> <span class="tag ${s.type === 'DAT' ? 'ok' : s.type === 'Sa hình' ? 'warn' : s.type === 'Lý thuyết' ? 'info' : ''}" ${s.type === 'Cabin' ? 'style="background:#C8F2DC;color:#04603A"' : ''}>${esc(s.type)}</span>
    ${s.plate ? `<span class="plate">${esc(s.plate)}</span>` : ''}</div>
    <div class="meta">🕐 ${esc(s.slot)} · ${s.teacherName ? `<span class="pill gv" style="background:${esc(s.teacherColor || '#78909C')}">Gv. ${esc(s.teacherShort || short2(s.teacherName))}</span>` : ''}
    ${s.type === 'DAT' ? ` · ${fmt(s.actualKm !== null && s.actualKm !== undefined ? s.actualKm : s.km)} km` : ''}${s.groupLabel ? ' · ' + esc(s.groupLabel) : ''}${s.attendance && s.attendance !== 'Đã học' ? ' · ' + esc(s.attendance) : ''}${s.courseCode ? ' · ' + esc(s.courseCode) : ''}</div>
  </div>`;
}
async function editSession(id) {
  const all = window.__sessCache || [];
  const s = all.find(x => x.id === id);
  if (!s) { toast('Không tìm thấy buổi học'); return; }
  const tOpts = LOOK.teachers.map(t => `<option value="${t.id}" ${t.id === s.teacherId ? 'selected' : ''}>Gv. ${esc(t.shortName || t.name)}</option>`).join('');
  const vOpts = LOOK.vehicles.map(v => `<option value="${v.id}" ${v.id === s.vehicleId ? 'selected' : ''}>${esc(v.plate)}</option>`).join('');
  openModal(`<h3>Sửa buổi học</h3>
    <div class="frow"><div><label>Ngày</label><input type="date" id="esDate" value="${s.date}"></div>
    <div><label>Khung giờ</label><select id="esSlot">${['06-08h','08-10h','10-12h','13-15h','15-17h','17-19h'].map(x => `<option ${x === s.slot ? 'selected' : ''}>${x}</option>`).join('')}</select></div></div>
    <div class="frow"><div><label>Loại buổi</label><select id="esType">${['DAT', 'Sa hình', 'Lý thuyết', 'Cabin', 'Thi tốt nghiệp', 'Bổ túc'].map(x => `<option ${x === s.type ? 'selected' : ''}>${x}</option>`).join('')}</select></div>
    <div><label>Học viên</label><input value="${esc(s.studentName || s.groupLabel || '')}" disabled></div></div>
    <div class="frow"><div><label>Giáo viên</label><select id="esTeacher"><option value="">—</option>${tOpts}</select></div>
    <div><label>Xe</label><select id="esVehicle"><option value="">—</option>${vOpts}</select></div></div>
    <div class="frow"><div><label>Km kế hoạch</label><input type="number" id="esKm" value="${s.km || 0}"></div>
    <div><label>Km thực tế</label><input type="number" id="esActual" value="${s.actualKm === null || s.actualKm === undefined ? '' : s.actualKm}" placeholder="Để trống nếu chưa chạy"></div></div>
    <div class="frow"><div><label>Điểm danh</label><select id="esAtt">${['Đã học', 'Vắng', 'Chưa điểm danh'].map(x => `<option ${x === s.attendance ? 'selected' : ''}>${x}</option>`).join('')}</select></div>
    <div><label>Ghi chú</label><input id="esNote" value="${esc(s.note || '')}"></div></div>
    <div class="mfoot"><button class="btn danger" id="esDel">Xóa buổi</button><span style="flex:1"></span>
    <button class="btn sec" onclick="closeModal()">Đóng</button><button class="btn" id="esSave">Lưu</button></div>`);
  $('#esSave').onclick = async () => {
    const veh = LOOK.vehicles.find(v => v.id === Number($('#esVehicle').value));

<script>
/* ================= LỊCH DAT & SA HÌNH ================= */
const SC = { view: 'week', anchor: TODAY, teacherId: '', vehicleId: '', centerName: '', type: '', studentId: '' };
function mondayOf(dstr) { const d = new Date(dstr + 'T00:00:00'); const dow = (d.getDay() + 6) % 7; d.setDate(d.getDate() - dow); return d.toISOString().slice(0, 10); }
function addDays(dstr, n) { const d = new Date(dstr + 'T00:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); }
VIEWS.schedule = async main => {
  if (!apiConfigured()) { main.innerHTML = noApiBanner(); return; }
  let from, to;
  if (SC.view === 'day') { from = to = SC.anchor; }
  else if (SC.view === 'week') { from = mondayOf(SC.anchor); to = addDays(from, 6); }
  else { from = SC.anchor.slice(0, 7) + '-01'; const d = new Date(from + 'T00:00:00'); d.setMonth(d.getMonth() + 1); d.setDate(0); to = d.toISOString().slice(0, 10); }
  const [r, cf] = await Promise.all([call('listschedulesrange', { from, to }), call('listconflicts', {})]);
  const confIds = new Set(); (cf.conflicts || []).forEach(c => (c.sessions || []).forEach(s => confIds.add(s.id)));
  window.__conflictIds = confIds;
  let rows = r.schedules.slice();
  if (SC.teacherId) rows = rows.filter(s => s.teacherId === Number(SC.teacherId));
  if (SC.vehicleId) rows = rows.filter(s => s.vehicleId === Number(SC.vehicleId));
  if (SC.centerName) rows = rows.filter(s => (s.centerName || '') === SC.centerName);
  if (SC.type) rows = rows.filter(s => s.type === SC.type);
  if (SC.studentId) rows = rows.filter(s => s.studentId === Number(SC.studentId));
  window.__sessCache = rows;
  const banner = cf.conflicts.length ? `<div class="conflict-banner" onclick="document.getElementById('confList').scrollIntoView({behavior:'smooth'})">⚠️ ${cf.conflicts.length} lịch trùng - Bấm để sửa</div>` : '';
  const confList = cf.conflicts.length ? `<div class="card" id="confList"><h3>⚠️ Chi tiết lịch trùng</h3>${cf.conflicts.map(c => `<div class="alert error"><b>${esc(c.kind)}</b> · ${dVN(c.date)} · ${esc(c.slot)} · ${esc(c.key.split('|').pop() || '')}<br>${c.sessions.map(s => `${esc(s.studentName || s.courseCode)} (${esc(s.type)}, ${esc(s.plate || '—')})`).join(' · ')}</div>`).join('')}</div>` : '';
  let body = '';
  if (SC.view === 'month') {
    const totals = {}; (r.dayTotals || []).forEach(t => totals[t.date] = t.sessions);
    const marks = {}; (r.markers || []).forEach(m => { (marks[m.date] = marks[m.date] || []).push(m); });
    let cells = '';
    const startDow = (new Date(from + 'T00:00:00').getDay() + 6) % 7;
    for (let i = 0; i < startDow; i++) cells += '<div class="mcell off"></div>';
    for (let d = from; d <= to; d = addDays(d, 1)) {
      const n = totals[d] || 0;
      const mk = (marks[d] || []).map(m => m.kind === 'exam' ? '<span class="dot" style="background:var(--red)"></span>' : '<span class="dot" style="background:var(--orange)"></span>').join('');
      cells += `<div class="mcell ${d === TODAY ? 'today' : ''}" onclick="SC.view='day';SC.anchor='${d}';go('schedule')"><div class="d">${d.slice(8)}</div><div class="n">${n ? n + ' buổi' : ''}</div>${mk}</div>`;
    }
    body = `<div class="card"><h3>Tháng ${SC.anchor.slice(5, 7)}/${SC.anchor.slice(0, 4)}</h3><div class="mgrid">${cells}</div>
    <div style="font-size:12.5px;color:var(--mut);margin-top:8px"><span class="dot" style="background:var(--red)"></span>Ngày thi sát hạch · <span class="dot" style="background:var(--orange)"></span>Bế giảng</div></div>`;
  } else {
    const days = SC.view === 'day' ? [SC.anchor] : Array.from({ length: 7 }, (_, i) => addDays(from, i));
    body = days.map(d => {
      const dayRows = rows.filter(s => s.date === d).sort((a, b) => (a.startMinutes || 0) - (b.startMinutes || 0));
      return `<div class="daycol"><h4>${['Thứ 2', 'Thứ 3', 'Thứ 4', 'Thứ 5', 'Thứ 6', 'Thứ 7', 'Chủ nhật'][(new Date(d + 'T00:00:00').getDay() + 6) % 7]} · ${dVN(d)} ${d === TODAY ? '(hôm nay)' : ''} — ${dayRows.length} buổi</h4>
      ${dayRows.length ? dayRows.map(s => sessCard(s, confIds)).join('') : '<div style="color:var(--mut);font-size:13px">Không có buổi nào</div>'}</div>`;
    }).join('');
    body = `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px">${body}</div>`;
  }
  const cabinHtml = (r.cabinByCourse || []).map(c => `<tr><td data-l="Khóa"><b>${esc(c.courseCode)}</b></td><td data-l="HV" class="num">${c.students}</td><td data-l="Đủ 3h" class="num">${c.done3h}</td><td data-l="TB giờ" class="num">${c.avgHours}h</td><td data-l="%" class="num">${c.pct}%</td></tr>`).join('');
  main.innerHTML = `${banner}
  <div class="toolbar">
    <div class="f sm"><label>Chế độ xem</label><select id="scView"><option value="day" ${SC.view === 'day' ? 'selected' : ''}>Theo ngày</option><option value="week" ${SC.view === 'week' ? 'selected' : ''}>Theo tuần</option><option value="month" ${SC.view === 'month' ? 'selected' : ''}>Theo tháng</option></select></div>
    <div class="f sm"><label>Ngày</label><input type="date" id="scAnchor" value="${SC.anchor}"></div>
    <div class="f sm"><label>Giáo viên</label><select id="scTeacher"><option value="">Tất cả GV</option>${LOOK.teachers.map(t => `<option value="${t.id}" ${String(t.id) === SC.teacherId ? 'selected' : ''}>Gv. ${esc(t.shortName || t.name)}</option>`).join('')}</select></div>
    <div class="f sm"><label>Xe</label><select id="scVehicle"><option value="">Tất cả xe</option>${LOOK.vehicles.map(v => `<option value="${v.id}" ${String(v.id) === SC.vehicleId ? 'selected' : ''}>${esc(v.plate)}</option>`).join('')}</select></div>
    <div class="f sm"><label>Loại buổi</label><select id="scType"><option value="">Tất cả</option>${['DAT', 'Sa hình', 'Lý thuyết', 'Cabin', 'Thi tốt nghiệp', 'Bổ túc'].map(x => `<option ${SC.type === x ? 'selected' : ''}>${x}</option>`).join('')}</select></div>
    <div class="f"><label>Học viên</label><input id="scStudent" list="stuList" placeholder="Gõ tên hoặc mã HV…" value="${SC.studentId ? esc((LOOK.students.find(s => s.id === Number(SC.studentId)) || {}).name || '') : ''}"><datalist id="stuList">${LOOK.students.map(s => `<option data-id="${s.id}" value="${esc(s.name)} (${esc(s.code)})">`).join('')}</datalist></div>
    <button class="btn sec" id="scClear">Xóa lọc</button>
    <button class="btn" id="scAdd">+ Thêm buổi</button>
  </div>
  ${confList}${body}
  <div class="card"><h3>🚐 Cabin theo khóa & Lý thuyết</h3>
  <table><thead><tr><th>Khóa</th><th class="num">HV</th><th class="num">Đủ 3h cabin</th><th class="num">TB giờ/HV</th><th class="num">%</th></tr></thead><tbody>${cabinHtml}</tbody></table>
  <div style="font-size:13px;color:var(--mut);margin-top:8px">Buổi Lý thuyết và Cabin hiển thị trong lưới lịch theo nhóm khóa (thẻ xanh dương = Lý thuyết, xanh bạc hà = Cabin).</div></div>`;
  const apply = () => {
    SC.view = $('#scView').value; SC.anchor = $('#scAnchor').value || TODAY;
    SC.teacherId = $('#scTeacher').value; SC.vehicleId = $('#scVehicle').value; SC.type = $('#scType').value;
    const sv = $('#scStudent').value.trim();
    const m = LOOK.students.find(s => (s.name + ' (' + s.code + ')') === sv || s.name === sv);
    SC.studentId = m ? String(m.id) : '';
    go('schedule');
  };
  ['scView', 'scAnchor', 'scTeacher', 'scVehicle', 'scType', 'scStudent'].forEach(id => { const el = document.getElementById(id); if (el) el.onchange = apply; });
  $('#scClear').onclick = () => { Object.assign(SC, { teacherId: '', vehicleId: '', centerName: '', type: '', studentId: '' }); go('schedule'); };
  $('#scAdd').onclick = () => scheduleForm();
};
function scheduleForm() {

  <div class="frow"><div><label>Sa hình</label><select id="xfSahinh">${['Chưa thi', 'Đậu', 'Rớt'].map(v => sel(v, x.sahinh)).join('')}</select></div>
  <div><label>Điểm SH</label><input type="number" id="xfSahinhScore" value="${x.sahinhScore === null ? '' : x.sahinhScore}"></div></div>
  <div class="frow"><div><label>Đường trường</label><select id="xfRoad">${['Chưa thi', 'Đậu', 'Rớt'].map(v => sel(v, x.road)).join('')}</select></div>
  <div><label>Điểm ĐT</label><input type="number" id="xfRoadScore" value="${x.roadScore === null ? '' : x.roadScore}"></div></div>
  <div class="frow"><div><label>Kết quả chung</label><select id="xfPassed"><option value="0" ${!x.passed ? 'selected' : ''}>Rớt / Chưa đạt</option><option value="1" ${x.passed ? 'selected' : ''}>ĐẬU</option></select></div>
  <div><label>Phí thi lại (đ)</label><input type="number" id="xfFee" value="${x.retakeFee || 0}"></div></div>
  <div><label>Ghi chú</label><input id="xfNote" value="${esc(x.note || '')}"></div>
  <div class="mfoot"><button class="btn sec" onclick="closeModal()">Hủy</button><button class="btn" id="xfSave">Lưu kết quả</button></div>`);

    await write('updateexamresult', { examId: x.id, studentId: x.studentId, examDate: $('#xfDate').value, sbd: $('#xfSbd').value.trim(),
      theory: $('#xfTheory').value, theoryScore: $('#xfTheoryScore').value === '' ? null : Number($('#xfTheoryScore').value),
      sahinh: $('#xfSahinh').value, sahinhScore: $('#xfSahinhScore').value === '' ? null : Number($('#xfSahinhScore').value),
      road: $('#xfRoad').value, roadScore: $('#xfRoadScore').value === '' ? null : Number($('#xfRoadScore').value),
      passed: $('#xfPassed').value === '1', retakeFee: Number($('#xfFee').value) || 0, note: $('#xfNote').value.trim() });
    closeModal(); go('exams');
  };
}
function gradForm(studentId, name) {
  openModal(`<h3>Thi tốt nghiệp — ${esc(name)}</h3>
  <div class="frow"><div><label>Ngày thi TN</label><input type="date" id="gfDate" value="${TODAY}"></div>
  <div><label>Kết quả</label><select id="gfResult"><option>Đậu</option><option>Rớt</option></select></div></div>
  <div class="frow"><div><label>Số chứng chỉ</label><input id="gfCert"></div>
  <div><label>Ngày cấp CC</label><input type="date" id="gfCertDate"></div></div>
  <div class="mfoot"><button class="btn sec" onclick="closeModal()">Hủy</button><button class="btn" id="gfSave">Lưu</button></div>`);

}
function licenseForm(studentId, name) {
  openModal(`<h3>Cấp bằng — ${esc(name)}</h3>
  <div class="frow"><div><label>Ngày có bằng</label><input type="date" id="lfDate" value="${TODAY}"></div>
  <div><label>Điểm thi (tổng)</label><input type="number" id="lfScore"></div></div>
  <div class="mfoot"><button class="btn sec" onclick="closeModal()">Hủy</button><button class="btn" id="lfSave">Đã cấp bằng</button></div>`);
  $('#lfSave').onclick = async () => { await write('updatelicensestatus', { studentId, hasLicense: true, licenseDate: $('#lfDate').value, licenseScore: $('#lfScore').value === '' ? null : Number($('#lfScore').value) }); closeModal(); go('exams'); };
}
async function copyZalo(studentId) {
  const s = (window.__examData ? window.__examData.results : []).find(x => x.studentId === studentId);
  if (!s) return;
  const txt = zaloLicenseText({ name: s.name, licenseClass: s.licenseClass, licenseDate: s.licenseDate });
  try { await navigator.clipboard.writeText(txt); toast('📋 Đã copy tin nhắn Zalo — dán vào Zalo OA để gửi'); }
  catch (e) { openModal('<h3>Tin nhắn Zalo</h3><textarea style="min-height:150px">' + esc(txt) + '</textarea><div class="mfoot"><button class="btn" onclick="closeModal()">Đóng</button></div>'); }
}

<script>
/* ================= BÁO CÁO ================= */
VIEWS.reports = async main => {

    </div>
    <div class="card"><h3>Cơ cấu chi phí tháng (triệu đ)</h3>

    <h3 style="margin-top:16px">Doanh thu theo khóa</h3>

    ${r.datByVehicle.map(v => `<tr><td data-l="Xe"><b>${esc(v.plate)}</b></td><td data-l="Km" class="num">${fmt(v.km)}</td><td data-l="Buổi" class="num">${v.sessions}</td></tr>`).join('')}

    </tbody></table></div>
  </div>
  <div class="card"><h3>📄 Báo cáo mẫu Sở GTVT</h3>

    ${g.byCourse.map(c => `<tr><td data-l="Khóa"><b>${esc(c.courseCode)}</b></td><td data-l="Hạng">${esc(c.licenseClass)}</td><td data-l="KG">${dVN(c.openDate)}</td><td data-l="BG">${dVN(c.closeDate)}</td><td data-l="Tổng" class="num">${c.total}</td><td data-l="TN" class="num">${c.graduated}</td><td data-l="Đã thi" class="num">${c.examined}</td><td data-l="Đậu" class="num">${c.passed}</td></tr>`).join('')}
    </tbody></table>
    <div style="margin:14px 0 10px"><b>Mẫu 2 — Danh sách đăng ký học (${g.enrollments.length} HV)</b> <button class="btn sec small" style="float:right" onclick="printGov(2)">In mẫu 2</button></div>

    ${g.examByDate.map(e => `<div style="font-size:14px;padding:6px 0;border-bottom:1px solid var(--line)">📅 ${dVN(e.examDate)} — ${e.total} thí sinh, đậu ${e.passed} (${e.total ? Math.round(e.passed / e.total * 100) : 0}%)</div>`).join('')}
  </div>`;

};
function printGov(n) {
  const g = window.__gov; if (!g) return;

  if (n === 3) printHtml(head + `<h3 style="text-align:center">BÁO CÁO KẾT QUẢ SÁT HẠCH THEO NGÀY THI</h3>${g.examByDate.map(e => `<h4>Ngày thi: ${dVN(e.examDate)} — Đậu ${e.passed}/${e.total}</h4><table border="1" cellspacing="0" cellpadding="5" style="width:100%;border-collapse:collapse"><tr><th>Mã HV</th><th>Họ tên</th><th>Khóa</th><th>SBD</th><th>Lý thuyết</th><th>Sa hình</th><th>Đường trường</th><th>Kết quả</th></tr>${e.students.map(s => `<tr><td>${esc(s.code)}</td><td>${esc(s.name)}</td><td>${esc(s.courseCode)}</td><td>${esc(s.sbd)}</td><td>${esc(s.theory)}</td><td>${esc(s.sahinh)}</td><td>${esc(s.road)}</td><td>${esc(s.result)}</td></tr>`).join('')}</table>`).join('')}</div>`);
}

/* ================= CẢNH BÁO & ZALO ================= */

    <div class="card"><h3>💬 Thông báo đã gửi (Zalo OA / nội bộ)</h3>

    <div style="margin-top:14px"><label>Tiêu đề thông báo mới</label><input id="ntTitle">
    <label style="margin-top:8px">Nội dung</label><textarea id="ntMsg" style="min-height:70px"></textarea>
    <button class="btn" style="margin-top:10px" id="ntSend">Gửi thông báo</button></div></div>`;
  }
  main.innerHTML = body + `
  <div class="card"><h3>⚙️ Cấu hình API</h3>
    <p style="font-size:14px;line-height:1.6">Địa chỉ Web App Apps Script hiện tại:<br><b style="word-break:break-all">${esc(API_URL || '(chưa có)')}</b></p>
    <div class="frow" style="margin-top:10px"><div><label>URL /exec mới</label><input id="apiUrlIn" placeholder="https://script.google.com/macros/s/…/exec"></div></div>

  </div>`;
  const send = document.getElementById('ntSend');
  if (send) send.onclick = async () => { await write('sendnotification', { title: $('#ntTitle').value.trim(), message: $('#ntMsg').value.trim() }); go('alerts'); };
  $('#apiSave').onclick = () => { const v = $('#apiUrlIn').value.trim(); if (!v) return; try { localStorage.setItem('hp_api_url', v); } catch (e) {} location.search = '?api=' + encodeURIComponent(v); };
};
