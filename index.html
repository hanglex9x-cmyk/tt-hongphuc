<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>Quản lý Trung tâm Đào tạo Lái xe Hồng Phúc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#ffffff; --surface:#ffffff; --surface-alt:#f2f7f3;
  --text:#0C2417; --dim:#4B6656; --border:#DCE8DF;
  --accent:#00B050; --accent-dark:#007A38; --warn:#FFC107; --danger:#E53935;
  --navy:#1E3A8A; --radius:20px;
  --font-sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{overflow-x:clip;max-width:100%}
body{font-family:var(--font-sans);overscroll-behavior:none;background:#ffffff;min-height:100dvh;margin:0;color:var(--text);font-size:15px;line-height:1.45}
img,svg,video,canvas{max-width:100%}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--text)}
@media(min-width:768px){input,select,textarea{font-size:14px}}
a{color:var(--accent-dark)}
b,strong{font-weight:700}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

/* ---------- Shell ---------- */
.header-glass{background:linear-gradient(118deg,#007A38 0%,#00B050 52%,#00A047 78%,#1E3A8A 135%);border-bottom:1px solid rgba(255,255,255,.35);box-shadow:0 4px 14px rgba(0,90,45,.22);color:#fff;position:sticky;top:0;z-index:40}
.header-inner{display:flex;width:100%;align-items:center;gap:12px;padding:10px 12px}
@media(min-width:768px){.header-inner{padding:10px 24px}}
@media(max-width:767px){.header-inner{gap:8px;padding:8px 10px;align-items:center}.header-inner .hamb{height:36px;width:36px;flex:none}.header-inner>svg{width:36px;height:36px;flex:none;filter:drop-shadow(0 1px 2px rgba(0,60,30,.35))}}
.header-inner h1{margin:0;font-size:min(12.5px,3.2vw);font-weight:800;letter-spacing:0;line-height:1.3;white-space:nowrap}
@media(min-width:768px){.header-inner h1{font-size:18px}}
.header-inner .sub{margin:1px 0 0;font-size:min(9.5px,2.6vw);color:rgba(255,255,255,.85);line-height:1.35;white-space:normal}
.header-inner .sub span{text-decoration:none}
.h-name{margin:0;font-size:12px;font-weight:800;color:#fff;letter-spacing:.2px}
html,body{touch-action:manipulation}
.header-sub{padding:1px 12px 8px}
.h-phones{display:flex;align-items:center;gap:5px;color:#fff;font-weight:800;font-size:12.5px;line-height:1.3;white-space:nowrap;margin-left:2px}
.h-sub{margin:1px 0 0;font-size:11px;color:rgba(255,255,255,.88);line-height:1.35}
.btn-compact{min-height:36px;padding:6px 12px;font-size:13px;font-weight:700;border-radius:10px}
.mode-tabs.sm button{min-height:36px;padding:6px 12px;font-size:13px;border-radius:10px}
@media(min-width:768px){.header-inner .sub{font-size:12px}}
@media(min-width:768px){.header-inner .sub{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}}
.brand-yellow{color:#FFD400;text-shadow:0 1px 6px rgba(0,60,30,.55),0 0 2px rgba(0,60,30,.4)}
.hamb{display:flex;height:44px;width:44px;align-items:center;justify-content:center;border:none;border-radius:10px;background:rgba(255,255,255,.16);color:#fff;font-size:24px}
@media(min-width:768px){.hamb{display:none}}
.admin-box{display:none;text-align:right}
@media(min-width:768px){.admin-box{display:block}}
.admin-box p{margin:0}
.layout{display:flex;width:100%;align-items:flex-start}
.glass-panel{background:#ffffff;border:1px solid #DCE8DF;box-shadow:0 2px 10px rgba(0,60,30,.06);border-radius:20px}
.glass-nav{background:#ffffff;border:1px solid #DCE8DF;box-shadow:0 4px 16px rgba(0,60,30,.08)}
aside.sidebar{position:sticky;top:76px;margin:12px;width:264px;flex-shrink:0;display:none;flex-direction:column;gap:4px;padding:12px}
@media(min-width:768px){aside.sidebar{display:flex}}
main{flex:1;min-width:0;padding:12px 12px 96px}
@media(min-width:768px){main{padding:12px 8px 32px 0}}
.navbtn{display:flex;min-height:48px;width:100%;align-items:center;gap:12px;border:none;border-radius:12px;padding:8px 12px;font-size:14px;font-weight:600;background:transparent;color:#1d4030;text-align:left;transition:background .15s}
.navbtn:hover{background:#F2F7F3}
.navbtn.active{color:#fff}
.btn-green-grad{background:linear-gradient(135deg,#00C853 0%,#00B050 45%,#007A38 100%);box-shadow:0 5px 16px rgba(0,150,70,.38),inset 0 1px 0 rgba(255,255,255,.35);color:#fff}
.law-box{margin-top:12px;border-radius:12px;background:#E8F5E9;padding:12px;font-size:12px;line-height:1.6}
.law-box p{margin:0}
.drawer-wrap{position:fixed;inset:0;z-index:50}
@media(min-width:768px){.drawer-wrap{display:none}}
.drawer-bg{position:absolute;inset:0;background:rgba(6,61,32,.45);border:none;width:100%;height:100%}
.drawer-panel{position:absolute;top:0;left:0;height:100%;width:280px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;padding:12px;border-radius:0}
.bottomnav{position:fixed;right:0;bottom:0;left:0;z-index:40;border-radius:20px 20px 0 0;padding-bottom:env(safe-area-inset-bottom)}
@media(min-width:768px){.bottomnav{display:none}}
.bottomnav .grid5{display:grid;grid-template-columns:repeat(5,1fr);padding:4px}
.navbtn.compact{flex-direction:column;gap:2px;padding:6px 2px;font-size:11px;min-height:48px;align-items:center;text-align:center;line-height:1.15;justify-content:center}

/* ---------- Chung ---------- */
.stack{display:flex;flex-direction:column;gap:16px}
.stack-sm{display:flex;flex-direction:column;gap:8px}
.row-wrap{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
section.panel{padding:16px}
@media(min-width:768px){section.panel{padding:20px}}
.sec-head{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:12px}
.sec-head h2{margin:0;font-size:16px;font-weight:700}
@media(min-width:768px){.sec-head h2{font-size:18px}}
.sec-head .sub{margin:2px 0 0;font-size:12px;color:var(--dim)}
@media(min-width:768px){.sec-head .sub{font-size:14px}}
.loading{padding:40px 0;text-align:center;color:var(--dim)}
.loaderr{padding:40px 0;text-align:center;color:#E53935}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;border-radius:12px;padding:8px 14px;font-size:14px;font-weight:600;border:1px solid var(--border);background:#fff;color:var(--text)}
.btn:disabled{opacity:.5;cursor:default}
.btn-green{background:linear-gradient(135deg,#00C853 0%,#00B050 45%,#007A38 100%);box-shadow:0 5px 16px rgba(0,150,70,.38),inset 0 1px 0 rgba(255,255,255,.35);color:#fff;border:none}
.btn-amber{background:linear-gradient(135deg,#FFD54F 0%,#FFC107 55%,#FFA000 100%);box-shadow:0 5px 16px rgba(255,160,0,.32),inset 0 1px 0 rgba(255,255,255,.5);color:#111827;border:none}
.btn-blue{background:#0068FF;color:#fff;border:none}
.btn-danger{background:#E53935;color:#fff;border:none}
.btn-danger-o{background:#fff;color:#C62828;border:2px solid #E53935}
.btn-sm{min-height:40px;padding:6px 10px;font-size:13px;border-radius:10px}
.btn-xs{min-height:36px;padding:4px 10px;font-size:12px;border-radius:8px}
.btn-block{width:100%}
.input,.select{width:100%;min-height:48px;border-radius:10px;border:1px solid var(--border);padding:8px 12px;background:#fff}
.input-sm,.select-sm{min-height:44px}
textarea.input{min-height:80px}
.field{display:flex;flex-direction:column;gap:4px;font-size:14px}
.field>span{font-weight:500}
.field .hint{font-size:12px;color:var(--dim);font-weight:400}
.form-grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:768px){.form-grid{grid-template-columns:1fr 1fr}}
.form-grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.span2{grid-column:span 2}
.chip{display:inline-block;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:700;white-space:nowrap}
.tagchip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:500}
.teacher-pill{display:inline-flex;min-width:44px;align-items:center;justify-content:center;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:600;white-space:nowrap}
.plate-badge{display:inline-block;border-radius:6px;padding:2px 8px;font-family:ui-monospace,Menlo,monospace;font-size:13px;font-weight:700;color:#111827;background:#FFC107;white-space:nowrap}
.status-chip{display:inline-block;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;color:#fff;white-space:nowrap}
.bar{height:6px;border-radius:999px;background:var(--border);overflow:hidden;display:block}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--accent);font-style:normal}
.bar-lg{height:12px}
.mode-tabs{display:flex;flex-wrap:wrap;gap:8px}
.mode-tabs button{min-height:44px;border-radius:12px;padding:8px 16px;font-size:14px;font-weight:700;border:1px solid var(--border);background:#fff;color:var(--text)}
.mode-tabs button.on{border:none;color:#fff;background:linear-gradient(135deg,#00C853 0%,#00B050 45%,#007A38 100%);box-shadow:0 5px 16px rgba(0,150,70,.38),inset 0 1px 0 rgba(255,255,255,.35)}
.modtab{min-height:44px;border-radius:12px;padding:8px 16px;font-size:14px;font-weight:700;border:1px solid var(--border);background:#fff;color:var(--text);cursor:pointer;font-family:inherit}
.modtab.on{border:none;color:#fff;background:linear-gradient(135deg,#00C853 0%,#00B050 45%,#007A38 100%);box-shadow:0 5px 16px rgba(0,150,70,.38),inset 0 1px 0 rgba(255,255,255,.35)}
.note-dim{font-size:12px;color:var(--dim)}
.err-box{border-radius:12px;background:#FDECEA;padding:10px 12px;font-size:14px;color:#C62828}
.ok-box{border-radius:12px;background:#E8F5E9;padding:10px 12px;font-size:14px}
.warn-box{border-radius:12px;background:#FFF8E1;padding:10px 12px;font-size:14px}

/* ---------- Bảng ---------- */
.tbl-wrap{overflow-x:auto;max-width:100%}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
table.tbl thead tr{background:var(--navy);color:#fff;text-align:left}
table.tbl th{padding:10px 12px;font-weight:600;white-space:nowrap}
table.tbl td{padding:10px 12px;vertical-align:top}
table.tbl tbody tr.alt{background:var(--surface-alt)}
table.tbl-plain thead tr{background:transparent;color:var(--dim)}
table.tbl-plain th{border-bottom:1px solid var(--border);font-size:12px;padding:8px;white-space:normal}
table.tbl-plain td{border-bottom:1px solid rgba(220,232,223,.6);padding:10px 8px}
@media(min-width:768px){
  table.tbl,table.tbl-plain{font-size:13px}
  table.tbl th,table.tbl td{padding:6px 8px}
}
.d-only{display:none!important}
@media(min-width:768px){.d-only{display:block!important}}
.m-only{display:block!important}
@media(min-width:768px){.m-only{display:none!important}}
.mcard{border:1px solid var(--border);border-radius:16px;padding:12px;background:#fff}
.mlist{display:flex;flex-direction:column;gap:12px}

/* ---------- KPI / thẻ số ---------- */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(min-width:768px){.kpi-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1280px){.kpi-grid{grid-template-columns:repeat(5,1fr)}}
.kpi-card{padding:16px}
.kpi-card .lb{font-size:12px;font-weight:500;color:var(--dim);margin:0}
.kpi-card .vl{margin:4px 0 0;font-size:24px;font-weight:800;line-height:1.15}
.kpi-card .sb{margin:4px 0 0;font-size:12px;line-height:1.55;color:var(--dim)}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(min-width:1280px){.stat-grid{grid-template-columns:repeat(4,1fr)}}
.stat-card{border-radius:12px;background:var(--surface-alt);padding:14px}
.stat-card .lb{font-size:12px;font-weight:500;color:var(--dim);margin:0}
.stat-card .vl{margin:4px 0 0;font-size:24px;font-weight:800}
.stat-card .sb{margin:4px 0 0;font-size:12px;line-height:1.55;color:var(--dim)}
.grid2{display:grid;gap:16px}
@media(min-width:1280px){.grid2{grid-template-columns:1fr 1fr}}

/* ---------- Dashboard ---------- */
.alert-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;border-radius:12px;border-left:4px solid #ccc;padding:8px 12px;font-size:14px;width:100%;text-align:left;background:none;border-top:none;border-right:none;border-bottom:none;font-family:inherit;color:var(--text)}
.gantt-track{position:relative;height:32px;border-radius:8px;background:var(--surface-alt)}
.gantt-seg{position:absolute;top:4px;height:24px;display:flex;align-items:center;overflow:hidden;border-radius:6px;padding:0 8px;font-size:11px;font-weight:600;white-space:nowrap}
.heat-head{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:11px;font-weight:600;color:var(--dim)}
.heat-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:4px}
.heat-cell{display:flex;min-height:44px;flex-direction:column;align-items:center;justify-content:center;border-radius:8px;font-size:14px;font-weight:600;border:none;background:var(--surface-alt);color:var(--dim)}
.heat-cell small{font-size:9px;font-weight:400}
.heat-cell.sel{box-shadow:0 0 0 2px #fff,0 0 0 4px #1E3A8A}
.legend-row{display:flex;flex-wrap:wrap;gap:8px;font-size:11px;font-weight:600;align-items:center}
.legend-row .sw{display:inline-block;height:12px;width:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}

/* ---------- Lịch ---------- */
.conflict-banner{display:flex;min-height:48px;width:100%;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:2px solid #E53935;background:#FDECEA;padding:8px 16px;font-size:16px;font-weight:800;color:#C62828;font-family:inherit}
.remind-card{border:2px solid #E53935;background:#FFF5F5;border-radius:14px;padding:12px 14px}
.remind-card.ok{border-color:#BFE6CC;background:#F2FBF5}
.bell-btn{position:relative;display:flex;height:36px;width:36px;flex:none;align-items:center;justify-content:center;border:none;border-radius:10px;background:rgba(255,255,255,.16);color:#fff;cursor:pointer}
@media(min-width:768px){.bell-btn{height:44px;width:44px}}
.bell-badge{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:#E53935;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-sizing:border-box}
.bell-badge[hidden]{display:none}
.conflict-panel{border:2px solid #E53935;background:#FFF5F5;border-radius:12px;padding:12px}
.conflict-item{border-radius:12px;background:#fff;padding:10px}
.type-legend{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12px}
.type-legend .sw{display:inline-block;height:12px;width:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.week-wrap{display:flex;flex-direction:column;gap:12px}
@media(min-width:768px){
  .week-wrap{display:block;overflow-x:auto;max-width:100%}
  .week-grid{display:grid;grid-template-columns:repeat(7,minmax(118px,1fr));gap:8px;min-width:840px}
}
.day-col{padding:0;background:transparent;margin-bottom:22px}
.dhead-pill{text-align:center;margin:0 0 10px}
.dhead-pill span{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:#EDF3EE;padding:7px 16px;font-size:14px;font-weight:700;color:#0C2417}
.day-col.today .dhead-pill span{background:#D9F2E4;color:#007A38}
@media(min-width:768px){.dhead-pill span{font-size:12px;padding:6px 8px}}
.marker-pill{display:block;margin-bottom:6px;border-radius:999px;padding:2px 8px;text-align:center;font-size:11px;font-weight:700;color:#fff}
.sess-card{border-radius:16px;background:#fff;padding:12px 14px;font-size:13px;box-shadow:0 2px 10px rgba(12,36,23,.08);margin-bottom:10px}
.sess-card.clickable{cursor:pointer}
.sess-card.clickable:hover{box-shadow:0 0 0 2px #00B050}
.sess-card .nm{margin:8px 0 4px;font-size:19px;line-height:1.25;font-weight:800;word-break:break-word}
.sess-card .meta{font-size:11px;font-weight:600;color:var(--dim)}
.sess-card .sc-meta{margin:0;font-size:13.5px;color:#1F2937}
.sess-card .warnline{margin-top:4px;border-radius:6px;padding:2px 6px;font-weight:700;font-size:11px}
.swipe-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;max-width:100%;padding-bottom:6px;overscroll-behavior-x:contain}
.swipe-cols{display:flex;gap:8px;align-items:flex-start}
.swipe-cols .day-col{flex:0 0 104px;min-width:0;scroll-snap-align:start;margin-bottom:6px}
@media(min-width:768px){.swipe-cols .day-col{flex-basis:126px}}
.day-head{display:flex;flex-direction:column;align-items:center;border-radius:12px;background:#fff;box-shadow:0 2px 10px rgba(12,36,23,.08);padding:6px 4px 5px;margin-bottom:8px;border-bottom:3px solid var(--acc,#00B050)}
.day-head .dh-dow{font-size:20px;font-weight:800;line-height:1.05;color:#0C2417}
.day-head .dh-date{font-size:13px;font-weight:800;color:#0C2417}
.day-head .dh-today{margin-top:2px;font-size:9px;font-weight:800;color:#007A38;background:#D9F2E4;border-radius:99px;padding:1px 7px}
.day-col.today .day-head{background:#EAF7EE}
.sess-card2{position:relative;border-radius:14px;background:#fff;padding:10px 6px 10px 19px;font-size:13px;box-shadow:0 2px 10px rgba(12,36,23,.08);margin-bottom:10px;overflow:hidden}
.sess-card2::before{content:'';position:absolute;left:0;top:0;bottom:0;width:12px;background:var(--bar,#00B050)}
.sess-card2.clickable{cursor:pointer}
.sess-card2.clickable:hover{box-shadow:0 0 0 2px #00B050}
.sc2-top{display:flex;align-items:center;gap:7px;margin:0}
.sc2-badge{border-radius:999px;padding:3px 7px;font-size:10px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.sc2-time{font-size:12px;font-weight:800;white-space:nowrap}
.sess-card2 .nm{margin:5px 0 2px;font-size:15.5px;letter-spacing:0;line-height:1.25;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess-card2 .sc2-gv{margin:5px 0 0;text-align:right}
.sess-card2 .sc2-gv span{display:inline-block;color:#fff;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;line-height:1.2}
.sc2-sub{margin:0;font-size:11.5px;font-weight:600;color:#37474F;line-height:1.45}
.sess-card2 .warnline{margin-top:5px;border-radius:6px;padding:2px 6px;font-weight:700;font-size:11px}
.sess-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;border-radius:12px;padding:8px 12px;font-size:14px;background:var(--surface-alt);margin-bottom:6px}
.sess-row.clickable{cursor:pointer}
.sess-row.clickable:hover{box-shadow:0 0 0 2px #00B050}
.sess-row .nm{font-size:17px;font-weight:700}
.month-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.month-cell{display:flex;min-height:64px;flex-direction:column;align-items:flex-start;gap:3px;border-radius:10px;padding:6px;text-align:left;background:var(--surface-alt);border:1px solid var(--border);width:100%;min-width:0;overflow:hidden;font-family:inherit;color:var(--text);cursor:pointer}
.month-cell.out{background:#fff;opacity:.45}
.month-cell.today{border:2px solid #00B050}
.month-cell.sel{box-shadow:0 0 0 2px #1E3A8A}
.month-cell .dnum{font-size:15px;font-weight:800;line-height:1.1}
.month-cell .cnt{font-size:10px;font-weight:600;color:var(--dim);white-space:nowrap;line-height:1.1}
.mdots{display:flex;gap:3px;flex-wrap:wrap}
.mdots i{display:block;width:8px;height:8px;border-radius:99px}
.mmark{display:block;width:100%;height:5px;border-radius:99px;margin-top:auto}
.half-cluster{margin-bottom:14px}
.half-grid{display:grid;gap:4px}
.half-dow{margin:0;padding:4px 0;text-align:center;font-size:12px;font-weight:700;color:var(--dim)}
.half-cell{min-height:98px;gap:2px}
.half-cell.out{cursor:default}
.hline{display:block;font-size:11px;line-height:1.4;font-weight:500;overflow-wrap:break-word}
.hline b{font-weight:800}

<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast"><div class="tin" id="toast-in"></div></div>
<script>
/* =====================================================================
   HỒNG PHÚC — frontend GitHub Pages, dữ liệu qua Apps Script API (Sheet)
   Giao diện chép theo bản mẫu Muse artifact đã duyệt.
   ===================================================================== */

// ---------- Cấu hình API (GIỮ NGUYÊN) ----------
const DEFAULT_API_URL = 'https://script.google.com/macros/s/AKfycbxFG7h7a-FiI2UBB8bdr9UfyUZ936Vb0SKkBeikLorRDg8TECPxHGONSzkt9HrHVZuMQg/exec';
/* Khóa zoom mobile kiểu app: chặn pinch-zoom + double-tap zoom (iOS bỏ qua user-scalable=no) */
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('gesturechange', e => e.preventDefault());
document.addEventListener('touchmove', e => { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
let __lastTouchEnd = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if (now - __lastTouchEnd <= 300) e.preventDefault();
  __lastTouchEnd = now;
}, { passive: false });

const API_URL = (() => {
  const q = new URLSearchParams(location.search).get('api');
  if (q) { try { localStorage.setItem('hp_api_url', q); } catch (e) {} return q; }
  try { return localStorage.getItem('hp_api_url') || DEFAULT_API_URL; } catch (e) { return DEFAULT_API_URL; }
})();
const TODAY = '2026-10-27';
const MONTH_LABEL = 'tháng ' + Number(TODAY.slice(5, 7));

// ---------- API ----------
let cbSeq = 0;
function apiGet(action, params) {
  return new Promise((resolve, reject) => {
    const cb = '__hpcb' + (++cbSeq);
    const qs = new URLSearchParams({ action, callback: cb });
    Object.entries(params || {}).forEach(([k, v]) => { if (v !== undefined && v !== null && v !== '') qs.set(k, typeof v === 'object' ? JSON.stringify(v) : String(v)); });
    const sc = document.createElement('script');
    const timer = setTimeout(() => { cleanup(); reject(new Error('Quá thời gian chờ API')); }, 60000);
    function cleanup() { clearTimeout(timer); try { delete window[cb]; } catch (e) {} sc.remove(); }
    window[cb] = (data) => { cleanup(); resolve(data); };
    sc.onerror = () => { cleanup(); reject(new Error('Không gọi được API')); };
    sc.src = API_URL + '?' + qs.toString();
    document.head.appendChild(sc);
  });
}
async function apiPost(action, params) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 30000);
  try {
    const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, params: params || {} }), signal: ctl.signal });
    return await res.json();
  } catch (e) {
    if (e && e.name === 'AbortError') throw new Error('Quá thời gian chờ khi lưu (30 giây) — kiểm tra mạng rồi thử lại');
    throw e;
  } finally { clearTimeout(timer); }
}
// ---------- Cache đọc (tối ưu tốc độ) ----------
// Các action ít đổi được cache trong bộ nhớ theo khóa action + tham số đã sắp xếp.
// Ghi thành công qua write() sẽ xóa toàn bộ cache đọc để tránh dữ liệu cũ.
// Cần bỏ qua cache: gọi call(action, params, { force: true }) hoặc refresh(true).
const CACHEABLE_ACTIONS = new Set(['liststudents', 'listcenters', 'listexamrounds', 'getfleet', 'getdatsummary', 'listexams', 'listpayments', 'getreports', 'getgovreports', 'listnotifications', 'listadmissions', 'listfuellogs', 'listschedules', 'getcenterinfo']);
const READ_CACHE = new Map();
const INFLIGHT = new Map(); // gộp các request trùng action+params đang bay — tránh gọi API 2-3 lần giống hệt nhau
const RANGE_CACHE = new Map(); // cache listschedulesrange theo khóa from|to (ScheduleViews)
async function callRange_(from, to) {
  const rkey = from + '|' + to;
  if (RANGE_CACHE.has(rkey)) return RANGE_CACHE.get(rkey);
  const rr = await call('listschedulesrange', { from, to });
  RANGE_CACHE.set(rkey, rr);
  return rr;
}
function readCacheKey(action, params) {
  const entries = Object.entries(params || {})
    .filter(([, v]) => v !== undefined && v !== null && v !== '')
    .sort(([a], [b]) => (a < b ? -1 : a > b ? 1 : 0));
  return action + '|' + JSON.stringify(entries);
}
function clearReadCache() {
  READ_CACHE.clear();
  INFLIGHT.clear();
  RANGE_CACHE.clear();
  LK = null;   // cache getlookups riêng (khai báo ở khối dưới, gán lúc chạy)
  CONF = null; // cache listconflicts riêng
  lsClearSWR(); // cả bản lưu localStorage (khai báo ở khối SWR phía dưới)
}
// ---- Xóa cache CHỌN LỌC theo loại dữ liệu vừa ghi ----
// Trước đây mỗi lần ghi, write() xóa TOÀN BỘ cache đọc → mọi màn hình phải tải lại
// từ đầu (mỗi call tốn ~1–4 giây nền tảng Google) nên "lưu xong là đơ cả app".
// Nay mỗi action ghi chỉ xóa đúng nhóm dữ liệu nó làm thay đổi; action nào chưa có
// trong bảng WRITE_INVALIDATES thì vẫn xóa toàn bộ cho an toàn.
function bustReads_(actions) {
  if (!actions || !actions.length) return;
  const kill = (map) => { for (const k of [...map.keys()]) { if (actions.some(a => k.startsWith(a + '|'))) map.delete(k); } };
  kill(READ_CACHE); kill(INFLIGHT);
  try {
    const ks = [];
    for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith('hp_swr_') && actions.some(a => k.includes('_' + a + '|'))) ks.push(k); }
    ks.forEach(k => localStorage.removeItem(k));
  } catch (e) {}
}
const WB_SCHED = { r: ['listschedules', 'getdatsummary', 'getdashboard'], range: 1, ds: 1 };
const WB_STUD = { r: ['liststudents', 'getdashboard', 'listpayments', 'getreports', 'getgovreports', 'getdatsummary', 'listschedules'], range: 1, lk: 1, ds: 1 };
const WB_EXAM = { r: ['listexams', 'listexamrounds', 'getdashboard', 'getreports', 'getgovreports', 'liststudents'] };
const WRITE_INVALIDATES = {
  createschedule: WB_SCHED, updateschedule: WB_SCHED, deleteschedule: WB_SCHED,
  savestudent: WB_STUD, setstudentstatus: WB_STUD, transferstudentcourse: WB_STUD, enrolladmission: WB_STUD,
  addpayment: { r: ['listpayments', 'liststudents', 'getdashboard', 'getreports', 'getgovreports'] },
  saveteacher: { r: ['listschedules', 'getdatsummary'], range: 1, lk: 1 },
  savevehicle: { r: ['getfleet', 'listschedules'], range: 1, lk: 1 },
  savecenter: { r: ['listcenters', 'liststudents', 'listschedules'], range: 1, lk: 1 },
  deletecenter: { r: ['listcenters', 'liststudents', 'listschedules'], range: 1, lk: 1 },
  saveadmission: { r: ['listadmissions'] }, deleteadmission: { r: ['listadmissions'] }, setadmissiondoc: { r: ['listadmissions'] },
  savebotuc: { r: ['getfleet'] }, deletebotuc: { r: ['getfleet'] },
  addfuellog: { r: ['listfuellogs', 'getfleet'] }, deletefuellog: { r: ['listfuellogs', 'getfleet'] },
  savecenterinfo: { r: ['getcenterinfo'] },
  saveexamround: WB_EXAM, deleteexamround: WB_EXAM, updateexamresult: WB_EXAM, updategraduation: WB_EXAM,
  addroundregistration: { r: ['listexams', 'liststudents', 'getdashboard'] },
  removeroundregistration: { r: ['listexams', 'liststudents', 'getdashboard'] },
  updatelicensestatus: { r: ['liststudents', 'getdashboard', 'getreports', 'listexams'] },
  sendnotification: { r: ['listnotifications'] },
  saveprices: { r: [] },
};
function invalidateForWrite_(action) {
  const spec = WRITE_INVALIDATES[action];
  if (!spec) { clearReadCache(); return; }
  bustReads_(spec.r);
  if (spec.range) { RANGE_CACHE.clear(); CONF = null; }
  if (spec.lk) LK = null;
  if (spec.ds) { try { DS.data = null; } catch (e) {} window._DASH_SP = null; window._DASH = null; }
}
async function call(action, params, opts) {
  const cacheable = CACHEABLE_ACTIONS.has(action) && !(opts && opts.force);
  const key = cacheable ? readCacheKey(action, params) : null;
  if (cacheable && READ_CACHE.has(key)) return READ_CACHE.get(key);
  if (cacheable && INFLIGHT.has(key)) return INFLIGHT.get(key);
  const p = (async () => {
    const r = await apiGet(action, params);
    if (r && r.ok === false) throw new Error(r.error || 'Lỗi không xác định');
    if (cacheable) READ_CACHE.set(key, r);
    return r;
  })();
  if (cacheable) {
    INFLIGHT.set(key, p);
    p.catch(() => {}).then(() => { if (INFLIGHT.get(key) === p) INFLIGHT.delete(key); });
  }
  return p;
}
async function write(action, params) {
  const r = await apiPost(action, params);
  if (!r || r.ok === false) throw new Error((r && r.error) || 'Không lưu được');
  invalidateForWrite_(action); // chỉ xóa đúng nhóm cache mà dữ liệu vừa ghi làm thay đổi
  return r;
}
// ---------- SWR (stale-while-revalidate) qua localStorage ----------
// Payload các action đọc hay mở được lưu trên máy người dùng; lần mở app sau
// hiện bản đã lưu NGAY (không chờ API 1–2s), đồng thời gọi API ở nền — nếu dữ
// liệu mới khác bản đã lưu thì onFresh được gọi để vẽ lại. Bản lưu quá 7 ngày
// bị bỏ. Ghi dữ liệu (write) hoặc refresh(true) xóa hết qua clearReadCache().
function lsGetSWR(key) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return null;
    const o = JSON.parse(raw);
    if (!o || typeof o.t !== 'number' || Date.now() - o.t > 7 * 86400000) return null;
    return o.v;
  } catch (e) { return null; }
}
function lsSetSWR(key, v) { try { localStorage.setItem(key, JSON.stringify({ t: Date.now(), v })); } catch (e) {} }
function lsClearSWR() {
  try {
    const ks = [];
    for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith('hp_swr_')) ks.push(k); }
    ks.forEach(k => localStorage.removeItem(k));
  } catch (e) {}
}
function swrKey(action, params) {
  const dep = String(API_URL).split('/').slice(-2)[0].replace(/[^a-zA-Z0-9]/g, '').slice(-8);
  return 'hp_swr_' + dep + '_' + readCacheKey(action, params);
}
function modalOpen_() { const m = document.getElementById('modal-root'); return !!(m && m.innerHTML.trim()); }
async function callSWR(action, params, onFresh) {
  const key = swrKey(action, params);
  const cached = lsGetSWR(key);
  const net = (async () => {
    const r = await apiGet(action, params);
    if (r && r.ok === false) throw new Error(r.error || 'Lỗi không xác định');
    lsSetSWR(key, r);
    return r;
  })();
  if (cached !== null && cached !== undefined) {
    net.then(fresh => { try { if (onFresh && JSON.stringify(fresh) !== JSON.stringify(cached)) onFresh(fresh); } catch (e) {} }).catch(() => {});
    return cached;
  }
  return net;
}
// ---------- Prefetch nền (v13: gọn — chỉ nạp song song 4 dữ liệu nặng/hay dùng) ----------
// Sau khi dashboard render xong lần đầu (và chỉ 1 lần/phiên), nạp sẵn vào
// cache client: DAT (getdatsummary), Kỳ thi (listexams), cảnh báo trùng lịch
// và lịch TUẦN hiện tại. Chạy song song lúc trình duyệt rảnh
// (requestIdleCallback, dự phòng setTimeout 1500ms), lỗi thì bỏ qua lặng lẽ.
// Các mục còn lại (báo cáo, tuyển sinh, thông báo, học phí...) KHÔNG nạp nền
// nữa: từ backend v13 cache theo nhóm nên mở mục nào cũng chỉ tốn 1 call đã
// được hâm nóng phía server — nạp nền tràn lan chỉ tranh lượt chạy của
// Apps Script với thao tác thật của người dùng.
let PREFETCH_DONE = false;
function prefetchWarm_() {
  if (PREFETCH_DONE) return;
  PREFETCH_DONE = true;
  const run = () => {
    const jobs = [
      call('getdatsummary', {}),
      call('listexams', {}),
      getConflicts(),
      callRange_(mondayOf(TODAY), addDays(mondayOf(TODAY), 6))
    ];
    jobs.forEach(p => { Promise.resolve(p).catch(() => {}); });
  };
  if (typeof requestIdleCallback === 'function') requestIdleCallback(() => { run(); }, { timeout: 3000 });
  else setTimeout(run, 1500);
}

// ---------- Định dạng & ngày (an toàn múi giờ: tính bằng Date.UTC) ----------
const BRAND = { green: '#00B050', amber: '#FFC107', navy: '#1E3A8A', red: '#E53935' };
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function fmtMoney(n) { return `${(Number(n) || 0).toLocaleString('vi-VN')}đ`; }
function fmtMoneyShort(n) {
  n = Number(n) || 0;
  if (Math.abs(n) >= 1e9) return `${(n / 1e9).toLocaleString('vi-VN', { maximumFractionDigits: 2 })} tỷ`;
  if (Math.abs(n) >= 1e6) return `${(n / 1e6).toLocaleString('vi-VN', { maximumFractionDigits: 2 })}tr`;
  return fmtMoney(n);
}
function fmtKm(n) { return (Number(n) || 0).toLocaleString('vi-VN'); }
function fmtHours(n) { return `${String(n).replace('.', ',')}h`; }
function fmtPct(n) { return `${String(n).replace('.', ',')}%`; }
function fmtDate(iso) { if (!iso) return '—'; const p = String(iso).split('-'); return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : String(iso); }
function utcMs(iso) { const [y, m, d] = String(iso).split('-').map(Number); return Date.UTC(y || 2026, (m || 1) - 1, d || 1); }
function isoOf(ms) { return new Date(ms).toISOString().slice(0, 10); }
function addDays(iso, n) { return isoOf(utcMs(iso) + n * 86400000); }
function mondayOf(iso) { const dow = (new Date(utcMs(iso)).getUTCDay() + 6) % 7; return addDays(iso, -dow); }
function monthStartOf(iso) { return String(iso).slice(0, 7) + '-01'; }
function addMonths(iso, n) { const [y, m] = String(iso).split('-').map(Number); return isoOf(Date.UTC(y, (m - 1) + n, 1)); }
function daysBetween(a, b) { return Math.round((utcMs(b) - utcMs(a)) / 86400000); }
const DOW_LABELS = ['Thứ 2', 'Thứ 3', 'Thứ 4', 'Thứ 5', 'Thứ 6', 'Thứ 7', 'Chủ nhật'];
function shortStudentName(full) { const p = String(full || '').trim().split(/\s+/).filter(Boolean); return p.length <= 2 ? String(full || '').trim() : p.slice(-2).join(' '); }
function gvName(name) { const n = String(name || '').trim(); if (!n) return n; return n.startsWith('Gv.') ? n : `Gv. ${n}`; }
function normText(v) { return String(v || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd'); }

const COURSE_DATES = {
  K38: { open: '2026-06-01', close: '2026-09-30' }, K39: { open: '2026-07-01', close: '2026-10-31' },
  K40: { open: '2026-08-01', close: '2026-11-30' }, K41: { open: '2026-09-01', close: '2026-12-31' },
  'C1-K120': { open: '2026-07-01', close: '2026-12-31' }, BK220: { open: '2026-08-01', close: '2026-12-31' },
};
function courseOpenOf(code, open) { return open || (COURSE_DATES[code] || {}).open || ''; }
function courseCloseOf(code, close) { return close || (COURSE_DATES[code] || {}).close || ''; }
function courseKgHan(code, open, close) {
  const o = courseOpenOf(code, open), c = courseCloseOf(code, close), parts = [code];
  if (o) parts.push(`KG ${fmtDate(o)}`);
  if (c) parts.push(`Hạn ${fmtDate(c)}`);
  return parts.join(' · ');
}
function courseOptionLabel(code, open) { const o = courseOpenOf(code, open); return o ? `${code} — KG ${fmtDate(o)}` : code; }
function courseCodes_() {
  // Danh sach khoa THAT tu getlookups (Sheet KhoaHoc) — ban cung chi lam du phong khi chua tai duoc lookups.
  const cs = (LK && LK.courses) || [];
  return cs.length ? cs.map(c => c.code) : COURSE_OPTIONS;
}
function shortCenterName(name) { return String(name || '').replace(/^Trung tâm liên kết\s*/i, '').trim(); }
/* Mã viết tắt trung tâm cho lưới lịch 2 tuần — theo đúng mã lưới của trung tâm: HM / ACHAU / PHGIAO */
function centerAbbr(name) {
  const raw = shortCenterName(name);
  if (!raw) return '';
  const n = normText(raw);
  if (n.includes('hoc mon')) return 'HM';
  if (n.includes('thanh cong')) return 'TC';
  if (n.includes('nam sai gon')) return 'NSG';
  if (n.includes('a chau')) return 'ACHAU';
  if (n.includes('phu giao')) return 'PHGIAO';
  if (n.includes('hong phuc')) return 'HP';
  return raw.replace(/\s*\([^)]*\)\s*/g, '').split(/\s+/).filter(Boolean).map(w => w[0]).join('').toUpperCase().replace(/[^A-Z0-9]/g, '');
}

function slotHint(slot) {

function downloadFile(filename, content, mime) {
  const blob = new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function toCsv(rows, headers) {
  const e = (v) => { const s = String(v ?? ''); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const lines = [headers.join(',')];
  for (const r of rows) lines.push(headers.map(h => e(r[h] ?? '')).join(','));
  return `\uFEFF${lines.join('\r\n')}`;
}
function parseCsv(text) {
  const clean = String(text).replace(/^\uFEFF/, '');
  const rows = []; let cur = [], field = '', inQ = false;
  for (let i = 0; i < clean.length; i++) {
    const ch = clean[i] || '';
    if (inQ) {
      if (ch === '"') { if (clean[i + 1] === '"') { field += '"'; i++; } else inQ = false; }
      else field += ch;
    } else if (ch === '"') inQ = true;
    else if (ch === ',') { cur.push(field); field = ''; }
    else if (ch === '\n') { cur.push(field); field = ''; rows.push(cur); cur = []; }
    else if (ch !== '\r') field += ch;
  }
  if (field !== '' || cur.length) { cur.push(field); rows.push(cur); }
  const ne = rows.filter(r => r.some(c => c.trim() !== ''));
  if (ne.length < 2) return [];
  const headers = (ne[0] || []).map(h => h.trim());
  return ne.slice(1).map(r => { const o = {}; headers.forEach((h, i) => { o[h] = (r[i] || '').trim(); }); return o; });
}
function csvDate(v) { // dd/mm/yyyy -> yyyy-mm-dd (giữ nguyên nếu đã ISO)
  const m = String(v || '').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  return m ? `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}` : String(v || '');
}
function csvNum(v) { return Number(String(v || '').replace(/[^\d.-]/g, '')) || 0; }

function centerNameHtml_() {
  const w = String(CENTER.name || '').trim().split(/\s+/).filter(Boolean);

function parseSlot(slot) {
  const m = String(slot || '').trim().match(/^(\d{1,2})(?::(\d{2}))?\s*-\s*(\d{1,2})(?::(\d{2}))?/);
  if (!m) return { start: '08:00', end: '10:00' };
  const f = (h, mi) => `${String(Number(h ?? 8)).padStart(2, '0')}:${mi ?? '00'}`;
  return { start: f(m[1], m[2]), end: f(m[3], m[4]) };
}
function composeSlot(start, end) {
  const [sh = '08', sm = '00'] = String(start).split(':');
  const [eh = '10', em = '00'] = String(end).split(':');

  return `${start}-${end}`;
}

/* Biểu đồ cột SVG viết tay (thay recharts): series = [{key,name,color}], data = [{month,...}] */
function barChartSvg(data, series, height) {
  height = height || 240;
  if (!data.length) return '';
  const W = 720, H = height, padL = 44, padB = 26, padT = 14;
  const max = Math.max(1, ...data.flatMap(d => series.map(s => Math.abs(Number(d[s.key]) || 0))));
  const iw = W - padL - 8, ih = H - padB - padT;
  const groupW = iw / data.length;
  const bw = Math.min(26, (groupW - 14) / series.length);
  let g = '';
  for (let i = 0; i <= 4; i++) {
    const v = max * i / 4, y = padT + ih - ih * i / 4;
    g += `<line x1="${padL}" y1="${y}" x2="${W - 8}" y2="${y}" stroke="#e5e7eb" stroke-dasharray="3 3"/><text x="${padL - 6}" y="${y + 4}" font-size="11" fill="#4B6656" text-anchor="end">${Math.round(v)}</text>`;
  }
  data.forEach((d, di) => {
    series.forEach((s, si) => {
      const v = Number(d[s.key]) || 0;
      const h = Math.max(0, ih * v / max), hNeg = Math.max(0, ih * (-v) / max);
      const x = padL + di * groupW + (groupW - bw * series.length) / 2 + si * bw;
      const y = v >= 0 ? padT + ih - h : padT + ih;
      const hh = v >= 0 ? h : hNeg;
      if (hh > 0) g += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw}" height="${hh.toFixed(1)}" rx="3" fill="${s.color}"><title>${esc(d.month || d.label || '')} · ${esc(s.name)}: ${v}tr</title></rect>`;
    });
    g += `<text x="${(padL + di * groupW + groupW / 2).toFixed(1)}" y="${H - 8}" font-size="11" fill="#4B6656" text-anchor="middle">${esc(d.month || d.label || '')}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Biểu đồ cột" style="display:block">${g}</svg><div class="chart-legend">${series.map(s => `<span><span class="sw" style="background:${s.color}"></span>${esc(s.name)}</span>`).join('')}</div>`;
}

async function sfCheckCccd() {

async function sfSave() {

  const err = document.getElementById('sf-error');

  if (!name) { err.innerHTML = '<span class="err-box" style="display:block">Chưa nhập họ tên học viên.</span>'; return; }

  const courseCode = document.getElementById('sf-course').value;
  const course = (LK.courses || []).find(c => c.code === courseCode);

      name,
      phone: document.getElementById('sf-phone').value,
      cccd: document.getElementById('sf-cccd').value,
      dob: document.getElementById('sf-dob').value,
      address: document.getElementById('sf-address').value,
      courseCode,
      licenseClass: course ? course.licenseClass : '',

      healthExamDate: document.getElementById('sf-health').value,
      discount: disc,

    closeModal();
    refresh();
  } catch (e) {
    err.innerHTML = `<span class="err-box" style="display:block">${esc(e.message)}</span>`;
  }
}

function daySessionsFromCache_(dateStr) {

    const parts = k.split('|');
    if (parts.length === 2 && dateStr >= parts[0] && dateStr <= parts[1] && rr && Array.isArray(rr.schedules)) {
      return rr.schedules.filter(s => s.date === dateStr);

async function datCreate(pfx) {
  pfx = pfx || 'dc';
  if (_dcBusy) return; // đang xử lý — chặn bấm đúp gây lưu trùng
  _dcBusy = true;
  const box = document.getElementById(pfx + '-result');
  const btns = document.querySelectorAll('button[onclick*="datCreate"]');
  btns.forEach(b => { b.disabled = true; });
  try {
    // Chụp bản lookups TRƯỚC khi ghi: write() xóa cache đọc (LK thành null) nên
    // chạm vào LK sau khi ghi sẽ văng lỗi "null is not an object" dù đã lưu thành công.
    const lk = (await getLookups().catch(() => null)) || LK || {};
    const tStart = document.getElementById(pfx + '-start').value;
    const tEnd = document.getElementById(pfx + '-end').value;
    const payload = {
      date: document.getElementById(pfx + '-date').value,
      slot: composeSlot(tStart, tEnd),
      type: document.getElementById(pfx + '-type').value,
      studentId: document.getElementById(pfx + '-student').value ? Number(document.getElementById(pfx + '-student').value) : (state.focusStudentId || null),
      teacherId: document.getElementById(pfx + '-teacher').value ? Number(document.getElementById(pfx + '-teacher').value) : null,
      vehicleId: document.getElementById(pfx + '-vehicle').value ? Number(document.getElementById(pfx + '-vehicle').value) : null,
      km: 0,
    };
    payload.km = payload.type === 'DAT' ? (Number(document.getElementById(pfx + '-km').value) || 0) : 0;
    if (!tStart || !tEnd || tEnd <= tStart) {
      box.innerHTML = '<div class="err-box" style="margin-top:12px">Giờ kết thúc phải sau giờ bắt đầu — kiểm tra lại giờ học.</div>';
      return;
    }
    const veh = (lk.vehicles || []).find(v => v.id === payload.vehicleId);
    if (veh) payload.plate = veh.plate;
    box.innerHTML = '<p class="loading">Đang kiểm tra trùng lịch…</p>';
    // Kiểm tra trùng phía client trên lịch cùng ngày (backend Sheet không chặn trùng).
    // Ưu tiên dữ liệu lịch ĐÃ tải sẵn trên màn hình (RANGE_CACHE) — khỏi thêm 1 chuyến API chờ 1–4 giây;
    // ngày chưa có dữ liệu mới gọi API và ép lấy bản mới nhất (force).
    let dayList = daySessionsFromCache_(payload.date);
    if (!dayList) {
      const day = await call('listschedules', { date: payload.date }, { force: true });
      dayList = day.schedules || [];
    }
    // Trùng = khoảng giờ CHỒNG LẤN nhau (giờ tự do nên không so khớp chuỗi khung giờ nữa)
    const toMin_ = t => { const p = String(t).split(':'); return Number(p[0]) * 60 + Number(p[1] || 0); };
    const nR = parseSlot(payload.slot);
    const nS = toMin_(nR.start), nE = toMin_(nR.end);
    const same = dayList.filter(s => { const r = parseSlot(s.slot); return nS < toMin_(r.end) && toMin_(r.start) < nE; });
    const conflicts = [];
    if (payload.vehicleId && same.some(s => s.vehicleId === payload.vehicleId)) conflicts.push(`Trùng xe ${payload.plate || ''} — xe đã có buổi ${payload.slot} ngày ${fmtDate(payload.date)}`);
    if (payload.studentId && same.some(s => s.studentId === payload.studentId)) conflicts.push('Trùng học viên — HV đã có buổi cùng khung giờ');
    if (payload.studentId && dayList.some(s => s.studentId === payload.studentId)) conflicts.push('Học viên đã có buổi khác trong ngày (luật 1 HV tối đa 1 buổi/ngày)');
    if (payload.teacherId && same.some(s => s.teacherId === payload.teacherId)) conflicts.push('Trùng giáo viên — GV đã có buổi cùng khung giờ');
    if (conflicts.length) {
      const busyV = new Set(same.map(s => s.vehicleId));
      const busyT = new Set(same.map(s => s.teacherId));
      const freeV = (lk.vehicles || []).filter(v => !busyV.has(v.id) && v.status !== 'Bảo dưỡng').slice(0, 5);
      const freeT = (lk.teachers || []).filter(t => !busyT.has(t.id)).slice(0, 5);
      box.innerHTML = `<div class="err-box" style="margin-top:12px"><p style="margin:0;font-weight:700">Trùng lịch: ${conflicts.map(esc).join(' · ')}</p>
        ${freeV.length ? `<p style="margin-top:4px">Xe trống gần nhất khung giờ này: ${freeV.map(v => PlateBadge(v.plate)).join(' ')}</p>` : ''}
        ${freeT.length ? `<p style="margin-top:4px">GV còn trống: ${freeT.map(t => esc(t.name)).join(', ')}</p>` : ''}
        <p style="margin-top:4px">Chưa xếp lịch — đổi xe / GV / khung giờ rồi bấm Xếp lịch lại.</p></div>`;
      return;
    }
    // Giữ lại bản lịch trong cache để chèn buổi mới ngay sau khi ghi (khỏi tải lại toàn bộ)
    const rangeBackup = [];
    RANGE_CACHE.forEach((v, k) => { const p = k.split('|'); if (p.length === 2 && payload.date >= p[0] && payload.date <= p[1] && v && Array.isArray(v.schedules)) rangeBackup.push([k, v]); });
    const wr = await write('createschedule', payload);
    // Chèn buổi mới vào lại các khoảng lịch đã giữ: đóng form là lịch vẽ lại TỨC THÌ từ cache
    try {
      if (wr && wr.id && rangeBackup.length) {
        const stu2 = (lk.students || []).find(s => s.id === payload.studentId);
        const tch2 = (lk.teachers || []).find(t => t.id === payload.teacherId);
        const newSess = { id: wr.id, date: payload.date, slot: payload.slot, startMinutes: nS, type: payload.type, courseCode: stu2 ? stu2.courseCode : '', studentId: payload.studentId, studentName: stu2 ? stu2.name : '', teacherId: payload.teacherId, teacherName: tch2 ? tch2.name : '', teacherShort: tch2 ? tch2.name : '', teacherColor: '#90CAF9', vehicleId: payload.vehicleId, plate: payload.plate || '', centerName: stu2 ? (stu2.centerName || '') : '', km: payload.km, actualKm: null, attendance: 'Đã học', groupLabel: '', note: '', editable: true };
        rangeBackup.forEach(([k, v]) => {
          const dts = (v.dayTotals || []).map(d => d.date === payload.date ? { ...d, sessions: (d.sessions || 0) + 1 } : d);
          if (!dts.some(d => d.date === payload.date)) dts.push({ date: payload.date, sessions: 1 });
          RANGE_CACHE.set(k, { ...v, schedules: [...(v.schedules || []), newSess], dayTotals: dts });
        });
      }
    } catch (e) { /* chèn cache lỗi thì bỏ qua — lịch sẽ tự tải lại */ }
    const warnings = [];
    const stu = (lk.students || []).find(s => s.id === payload.studentId);
    const tch = (lk.teachers || []).find(t => t.id === payload.teacherId);
    if (stu && tch && stu.homeTeacherName && tch.name !== stu.homeTeacherName) warnings.push(`Đổi cặp GV: GV chính của ${stu.name} là ${gvName(stu.homeTeacherName)}`);
    if (stu && payload.plate && stu.plateKg && payload.plate !== stu.plateKg) warnings.push(`Đổi xe quen: xe khai giảng của ${stu.name} là ${stu.plateKg}`);
    const dsRow = DS.data && (DS.data.rows || []).find(r => r.studentId === payload.studentId);
    if (payload.type === 'Sa hình' && dsRow && dsRow.doneKm < 500) warnings.push(`${stu ? stu.name : 'HV'} chưa đủ 500km DAT (${dsRow.doneKm}km) — chưa đủ ĐK sa hình`);
    CONF = null;
    // KHÔNG refresh() ngay ở bản qc: refresh() -> go() luôn đóng modal nên thông báo + cảnh báo
    // chưa kịp hiện đã bị xóa. Nút Đóng sẽ tự đóng modal rồi mới refresh (đúng mẫu form sửa buổi học).
    box.innerHTML = `<div class="ok-box" style="margin-top:12px"><p style="margin:0;font-weight:600;color:#00893D">Đã xếp lịch thành công.</p>${warnings.length ? `<ul style="margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px">${warnings.map(w => `<li class="warn-box" style="padding:6px 10px;font-weight:600;color:#B45309">⚠ ${esc(w)}</li>`).join('')}</ul>` : ''}${pfx === 'qc' ? '<p style="margin-top:6px"><button type="button" class="btn btn-sm" onclick="closeModal();refresh()">Đóng</button></p>' : '<p style="margin-top:6px"><button type="button" class="btn btn-sm" onclick="refresh()">Tải lại lịch</button></p>'}</div>`;
    toast('Đã xếp lịch thành công');
  } catch (e) {
    box.innerHTML = `<div class="err-box" style="margin-top:12px">Không xếp được lịch — ${esc(e.message)}</div>`;
  } finally {
    _dcBusy = false;
    btns.forEach(b => { b.disabled = false; });
  }
}

  try {

      source: document.getElementById('af-source').value,

      deadline: document.getElementById('af-deadline').value,
      healthExamDate: document.getElementById('af-health').value,

      <p id="fl-msg"></p>
      <ul style="list-style:none;margin:0;padding:0" class="stack-sm">

function donutSvg(items, size) {
  size = size || 190;
  const total = items.reduce((a, x) => a + x.value, 0) || 1;
  let acc = 0; const cx = size / 2, r = size / 2 - 6, c = 2 * Math.PI * r;
  const segs = items.map(x => {
    const frac = x.value / total;
    const seg = `<circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="${x.color}" stroke-width="26" stroke-dasharray="${Math.max(0, frac * c - 3)} ${c}" stroke-dashoffset="${-acc * c}" transform="rotate(-90 ${cx} ${cx})"/>`;
    acc += frac; return seg;
  }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="Biểu đồ tròn">${segs}</svg>`;
}

function sessionsProgressHtml(sp) {

function ciLogoPick(input) {
  const f = input.files && input.files[0];
  if (!f) return;
  const url = URL.createObjectURL(f);
  const img = new Image();
  img.onload = () => {
    const sc = Math.min(1, 900 / img.naturalWidth);
    const w = Math.max(1, Math.round(img.naturalWidth * sc)), h = Math.max(1, Math.round(img.naturalHeight * sc));
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    CI_PENDING.logo = c.toDataURL('image/jpeg', 0.85);
    const side = Math.min(img.naturalWidth, img.naturalHeight);
    const m = document.createElement('canvas'); m.width = 256; m.height = 256;
    m.getContext('2d').drawImage(img, 0, 0, side, side, 0, 0, 256, 256);
    CI_PENDING.mark = m.toDataURL('image/jpeg', 0.85);
    URL.revokeObjectURL(url);
    const pv = document.getElementById('ci-logo-preview'); if (pv) pv.src = CI_PENDING.logo;
    const pm = document.getElementById('ci-mark-preview'); if (pm) pm.src = CI_PENDING.mark;
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast('Không đọc được ảnh — chọn ảnh khác'); };
  img.src = url;
}
async function ciSave(btn) {
  const name = (document.getElementById('ci-name').value || '').trim();
  const address = (document.getElementById('ci-address').value || '').trim();
  const phone = (document.getElementById('ci-phone').value || '').trim();
  if (!name) { toast('Nhập tên trung tâm'); return; }
  const payload = { name, address, phone };
  if (CI_PENDING.logo) { payload.logo = CI_PENDING.logo; payload.logoMark = CI_PENDING.mark; }
  const r = await write('savecenterinfo', payload, btn);
  if (r && r.ok) {
    CENTER.name = name; CENTER.address = address; CENTER.phone = phone;
    if (CI_PENDING.logo) { CENTER.logo = CI_PENDING.logo; CENTER.logoMark = CI_PENDING.mark; CI_PENDING = { logo: null, mark: null }; }
    applyCenterInfo_(null);
    toast('Đã lưu thông tin trung tâm');
  }
}
